<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4 Rhythm Game</title>
  <!-- 레트로 픽셀 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Press Start 2P', cursive;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 90vh;
      max-height: 700px;
      background-color: #050505;
      border: 4px solid #ff69b4;
      box-shadow: 0 0 20px rgba(255, 105, 180, 0.4);
      display: flex;
      flex-direction: column;
    }

    /* 상단 HUD (점수/콤보) */
    #hud {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background-color: #111;
      border-bottom: 2px solid #ff69b4;
      font-size: 0.8rem;
    }

    #score { color: #ffd700; }
    #combo { color: #ff69b4; }

    /* Canvas 및 오버레이 화면 */
    #canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .hidden { display: none !important; }

    h1 {
      color: #fcd3f2;
      font-size: 1.2rem;
      margin-bottom: 15px;
      line-height: 1.5;
      text-shadow: 3px 3px #FF69C7;
    }

    h2 {
      color: #ffffff;
      font-size: 0.9rem;
      margin-bottom: 25px;
     
    }

    p {
      font-size: 0.6rem;
      color: #aaa;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .start-btn {
      background-color: #ff69b4;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 0.8rem;
      cursor: pointer;
      box-shadow: 4px 4px 0px #ffffff;
      transition: transform 0.1s;
    }

    .start-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #ffffff;
    }

    /* 하단 터치 패드 */
    #touch-pads {
      display: flex;
      height: 70px;
      background-color: #111;
      border-top: 2px solid #ff69b4;
    }

    .pad {
      flex: 1;
      border-right: 1px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.9rem;
      color: #ff69b4;
    }

    .pad:last-child { border-right: none; }
    .pad.active {
      background-color: #ff69b4;
      color: #000;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- 시작 오버레이 -->
    <div id="start-screen" class="screen">
      <h1>ROMANTIC<br>RHYTHM</h1>
      <h2>START GAME</h2>
      <p>KEYBOARD: D - F - J - K<br>TOUCH: BOTTOM PADS</p>
      <button class="start-btn" id="start-btn">PLAY NOW</button>
    </div>

    <!-- 결과 오버레이 -->
    <div id="result-screen" class="screen hidden">
      <h1>STAGE CLEAR</h1>
      <p id="final-score" style="font-size: 0.8rem; color:#ffd700;"></p>
      <p id="final-combo" style="font-size: 0.7rem; color:#ff69b4;"></p>
      <button class="start-btn" id="retry-btn">RETRY</button>
    </div>
  </div>

  <!-- 하단 터치 영역 -->
  <div id="touch-pads">
    <div class="pad" id="pad-0">D</div>
    <div class="pad" id="pad-1">F</div>
    <div class="pad" id="pad-2">J</div>
    <div class="pad" id="pad-3">K</div>
  </div>
</div>

<script>
// ==========================================
// 1. 핵심 초기화 및 설정
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;

function resize() {
  width = canvas.width = wrapper.clientWidth;
  height = canvas.height = wrapper.clientHeight;
  laneWidth = width / 4;
  judgeLineY = height - 50;
}
window.addEventListener('resize', resize);
resize();

// 외부 오디오 설정
const bgm = new Audio();
bgm.src = './Gossip.mp3'; // 외부 MP3 파일 경로

// 효과음용 Web Audio API
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(freq, type = 'square', duration = 0.08) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ==========================================
// 2. 게임 패턴 및 상태 변수
// ==========================================
const NOTE_SPEED = 350;

// 노트 채보 패턴 (초 단위 위치)
const SONG_PATTERN = [
  { time: 1.2, lane: 0 }, { time: 1.7, lane: 1 }, { time: 2.2, lane: 2 }, { time: 2.7, lane: 3 },
  { time: 3.2, lane: 1 }, { time: 3.2, lane: 2 }, { time: 3.8, lane: 0 }, { time: 4.3, lane: 3 },
  { time: 5.0, lane: 0 }, { time: 5.4, lane: 1 }, { time: 5.8, lane: 2 }, { time: 6.2, lane: 3 },
  { time: 7.0, lane: 0 }, { time: 7.0, lane: 3 }, { time: 7.5, lane: 1 }, { time: 8.0, lane: 2 },
  { time: 8.5, lane: 0 }, { time: 8.8, lane: 1 }, { time: 9.1, lane: 2 }, { time: 9.4, lane: 3 },
  { time: 10.0, lane: 0 }, { time: 10.25, lane: 1 }, { time: 10.5, lane: 2 }, { time: 10.75, lane: 3 },
  { time: 11.2, lane: 1 }, { time: 11.5, lane: 2 }, { time: 12.0, lane: 0 }, { time: 12.4, lane: 3 }
];

let isPlaying = false;
let startTime = 0;
let score = 0;
let combo = 0;
let maxCombo = 0;
let activeNotes = [];
let effects = [];

// ==========================================
// 3. 게임 시작 및 오디오 재생
// ==========================================
function startGame() {
  initAudio();
  
  score = 0;
  combo = 0;
  maxCombo = 0;
  effects = [];
  
  activeNotes = SONG_PATTERN.map(n => ({ ...n, hit: false, missed: false }));
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  updateHUD();

  // 음원 초기화 및 재생 예외 처리
  bgm.currentTime = 0;
  const playPromise = bgm.play();
  if (playPromise !== undefined) {
    playPromise.catch(err => {
      console.warn("오디오 재생 실패 (파일 없음 또는 정책 차단):", err);
    });
  }

  bgm.onended = () => {
    endGame();
  };

  isPlaying = true;
  startTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score').innerText = String(score).padStart(6, '0');
  document.getElementById('combo').innerText = combo;
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgeLineY - 15,
    text: text,
    alpha: 1.0
  });
}

// 렌더링 프레임
function gameLoop(timestamp) {
  if (!isPlaying) return;

  const currentTime = (timestamp - startTime) / 1000;

  // 1. 화면 소거 (검은색)
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, width, height);

  // 2. 레인 구분선 그리기
  ctx.strokeStyle = '#220022';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  // 3. 판정선 그리기 (네온 핑크)
  ctx.strokeStyle = '#ff69b4';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();

  // 4. 노트 처리 및 그리기
  activeNotes.forEach(note => {
    if (note.hit) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - (timeDiff * NOTE_SPEED);
    const noteHeight = 16;

    // 미스 판정
    if (timeDiff < -0.18 && !note.missed) {
      note.missed = true;
      combo = 0;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    // 노트 출력
    if (noteY > -20 && noteY < height + 20 && !note.missed) {
      const x = note.lane * laneWidth + 6;
      const w = laneWidth - 12;

      ctx.fillStyle = (note.lane === 0 || note.lane === 3) ? '#fcd3f2' : '#ff69c7';
      ctx.fillRect(x, noteY - noteHeight / 2, w, noteHeight);
      
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, noteY - noteHeight / 2, w, noteHeight);
    }
  });

  // 5. 판정 텍스트 연출
  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.fillStyle = eff.text === 'MISS' ? `rgba(255, 0, 0, ${eff.alpha})` : `rgba(255, 215, 0, ${eff.alpha})`;
    ctx.font = '12px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(eff.text, eff.x, eff.y);

    eff.y -= 1;
    eff.alpha -= 0.04;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  // 6. 게임 종료 체크 (노트가 모두 끝나고 2초 뒤)
  const lastNote = SONG_PATTERN[SONG_PATTERN.length - 1];
  if (currentTime > lastNote.time + 2.0) {
    endGame();
    return;
  }

  requestAnimationFrame(gameLoop);
}

// ==========================================
// 4. 입력 및 판정
// ==========================================
function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = (performance.now() - startTime) / 1000;
  
  playSound(300 + lane * 100, 'square', 0.05);

  const target = activeNotes.find(n => n.lane === lane && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);
    
    if (diff <= 0.15) {
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      
      const isPerfect = diff <= 0.07;
      score += isPerfect ? 1000 : 500;
      
      addEffect(lane, isPerfect ? 'PERFECT' : 'GREAT');
      playSound(isPerfect ? 800 : 600, 'triangle', 0.1);
      updateHUD();
    }
  }
}

function endGame() {
  isPlaying = false;
  try {
    bgm.pause();
  } catch(e) {}
  document.getElementById('final-score').innerText = `SCORE: ${score}`;
  document.getElementById('final-combo').innerText = `MAX COMBO: ${maxCombo}`;
  document.getElementById('result-screen').classList.remove('hidden');
}

// ==========================================
// 5. 키보드 & 터치 이벤트
// ==========================================
const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, 'D': 0, 'F': 1, 'J': 2, 'K': 3 };

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const lane = keyMap[e.key];
  if (lane !== undefined) {
    document.getElementById(`pad-${lane}`)?.classList.add('active');
    triggerInput(lane);
  }
});

window.addEventListener('keyup', (e) => {
  const lane = keyMap[e.key];
  if (lane !== undefined) {
    document.getElementById(`pad-${lane}`)?.classList.remove('active');
  }
});

[0, 1, 2, 3].forEach(lane => {
  const pad = document.getElementById(`pad-${lane}`);
  
  const handleTouchStart = (e) => {
    e.preventDefault();
    pad.classList.add('active');
    triggerInput(lane);
  };
  
  const handleTouchEnd = (e) => {
    e.preventDefault();
    pad.classList.remove('active');
  };

  pad.addEventListener('touchstart', handleTouchStart);
  pad.addEventListener('touchend', handleTouchEnd);
  pad.addEventListener('mousedown', handleTouchStart);
  pad.addEventListener('mouseup', handleTouchEnd);
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
</script>

</body>
</html>
