<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>82 Rhythm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Press Start 2P', cursive;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      padding: 18px 15px 12px 15px;
      background-color: #000000;
      border-bottom: 2px solid #FDC7FB;
      font-size: 0.75rem;
      z-index: 5;
    }

    #score { color: #ffd700; }
    #combo { color: #fcd3f2; }

    #canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      background-color: #000000;
    }

    canvas {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background-color: #000000;
      z-index: 2;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000000; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 999;
    }

    .hidden { display: none !important; }

    h1 {
      color: #fcd3f2;
      font-size: 2.0rem;
      margin-bottom: 15px;
      line-height: 1.5;
      text-shadow: 3px 3px #FF69C7;
    }

    .start-btn {
      background-color: transparent;
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 12px 20px;
      font-size: 1.0rem;
      cursor: pointer;
    }

    .start-btn:active {
      transform: scale(0.98);
    }
     
    h2 {
      color: #ffffff;
      font-size: 0.75rem;
      margin-bottom: 25px;
    }

    /* 심플한 텍스트형 곡 선택 버튼 스타일 */
    .song-select-btn {
      background-color: transparent;
      color: #ffffff;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      margin-bottom: 20px;
      padding: 5px;
      transition: color 0.1s, transform 0.1s;
    }

    .song-select-btn:hover, .song-select-btn:active {
      color: #FF69C7;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- 1단계: 시작 화면 -->
    <div id="start-screen" class="screen">
      <h1>82 RHYTHM</h1>
      <h2>2026 WORK BY YUN</h2>
      <button class="start-btn" onclick="goToSongSelect()">START GAME</button>
    </div>

    <!-- 2단계: 곡 선택 화면 (심플 텍스트 스타일) -->
    <div id="song-select-screen" class="screen hidden">
      <h1 style="font-size: 1.5rem; margin-bottom: 30px;">SELECT SONG</h1>
      
      <button class="song-select-btn" onclick="startGame('gossip')">> GOSSIP</button>
      <button class="song-select-btn" onclick="startGame('trembling')">> 떨리는 맘</button>
    </div>

    <!-- 3단계: 결과 화면 -->
    <div id="result-screen" class="screen hidden"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;

function resize() {
  width = canvas.width = wrapper.clientWidth;
  height = canvas.height = wrapper.clientHeight;
  laneWidth = width / 4;
  judgeLineY = height - 105;
}
window.addEventListener('resize', resize);
resize();

const bgImage = new Image();
let isBgLoaded = false;
bgImage.onload = () => { isBgLoaded = true; };
bgImage.src = './Cover.png';

// 곡별 오디오 및 패턴 설정
const songs = {
  gossip: {
    src: './Gossip.mp3',
    pattern: generatePattern()
  },
  trembling: {
    src: './Trembling.mp3', // 필요시 파일명 경로에 맞게 수정 가능합니다
    pattern: generatePattern() // '떨리는 맘' 패턴 (동일 패턴 또는 별도 패턴 사용 가능)
  }
};

let currentBgm = new Audio();
const NOTE_SPEED = 550;

function generatePattern() {
  const rawData = [
    {t: 4.2, l: 0}, {t: 4.9, l: 3}, {t: 5.4, l: 1}, {t: 6.1, l: 2}, {t: 7.0, l: 0},
    {t: 7.8, l: 3}, {t: 8.6, l: 2}, {t: 9.2, l: 1}, {t: 10.1, l: 0}, {t: 10.9, l: 3},
    {t: 11.6, l: 1}, {t: 12.4, l: 2}, {t: 13.2, l: 0}, {t: 14.0, l: 3}, {t: 14.8, l: 1},
    {t: 15.3, l: 2}, {t: 15.7, l: 0}, {t: 16.4, l: 3}, {t: 17.1, l: 1}, {t: 17.7, l: 2},
    {t: 18.4, l: 0}, {t: 19.1, l: 3}, {t: 19.8, l: 1}, {t: 20.5, l: 2}, {t: 21.2, l: 0},
    {t: 21.9, l: 3}, {t: 22.5, l: 1}, {t: 23.2, l: 2}, {t: 24.0, l: 0}, {t: 24.7, l: 3},
    {t: 25.4, l: 1}, {t: 26.1, l: 2}, {t: 26.9, l: 0}, {t: 27.6, l: 3}, {t: 28.3, l: 1},
    {t: 29.0, l: 2}, {t: 29.8, l: 0}, {t: 30.5, l: 3}, {t: 31.2, l: 1}, {t: 31.9, l: 2},
    {t: 32.5, l: 0}, {t: 33.0, l: 3}, {t: 33.7, l: 2}, {t: 34.3, l: 1}, {t: 35.0, l: 0},
    {t: 35.7, l: 3}, {t: 36.4, l: 1}, {t: 37.1, l: 2}, {t: 37.8, l: 0}, {t: 38.5, l: 3},
    {t: 39.2, l: 1}, {t: 39.9, l: 2}, {t: 40.6, l: 0}, {t: 41.3, l: 3}, {t: 42.0, l: 1},
    {t: 42.7, l: 2}, {t: 43.4, l: 0}, {t: 44.1, l: 3}, {t: 44.8, l: 1}, {t: 45.5, l: 2},
    {t: 46.2, l: 0}, {t: 46.9, l: 3}, {t: 47.6, l: 1},
    {t: 48.2, l: 0}, {t: 48.2, l: 2}, {t: 49.0, l: 1}, {t: 49.7, l: 3}, {t: 50.4, l: 0},
    {t: 51.1, l: 2}, {t: 51.8, l: 1}, {t: 51.8, l: 3}, {t: 52.6, l: 0}, {t: 53.3, l: 2},
    {t: 54.0, l: 1}, {t: 54.7, l: 3}, {t: 55.4, l: 0}, {t: 55.4, l: 1}, {t: 56.2, l: 2},
    {t: 56.9, l: 3}, {t: 57.6, l: 0}, {t: 58.3, l: 1}, {t: 59.0, l: 2}, {t: 59.0, l: 3},
    {t: 59.8, l: 0}, {t: 60.5, l: 1}, {t: 61.2, l: 2}, {t: 61.9, l: 3}, {t: 62.6, l: 0},
    {t: 62.6, l: 2}, {t: 63.4, l: 1}, {t: 64.1, l: 3}, {t: 64.8, l: 0}, {t: 65.5, l: 2},
    {t: 66.2, l: 1}, {t: 66.2, l: 3}, {t: 67.0, l: 0}, {t: 67.7, l: 2}, {t: 68.4, l: 1},
    {t: 69.1, l: 3}, {t: 69.8, l: 0}, {t: 69.8, l: 2}, {t: 70.6, l: 1}, {t: 71.3, l: 3},
    {t: 72.0, l: 0}, {t: 72.7, l: 2}, {t: 73.4, l: 1}, {t: 74.1, l: 3}, {t: 74.8, l: 0},
    {t: 75.5, l: 2}, {t: 76.3, l: 1}, {t: 77.2, l: 3}, {t: 78.1, l: 0}, {t: 79.0, l: 2},
    {t: 79.9, l: 1}, {t: 80.8, l: 3}, {t: 81.7, l: 0}, {t: 82.6, l: 2}, {t: 83.6, l: 1},
    {t: 84.7, l: 3}, {t: 85.8, l: 0}, {t: 87.0, l: 2}, {t: 88.2, l: 1}, {t: 89.5, l: 3},
    {t: 90.9, l: 0}, {t: 92.3, l: 2}
  ];
  return rawData.map(item => ({ time: item.t, lane: item.l }));
}

let activeSongKey = 'gossip';
let isPlaying = false;
let startTime = 0;
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let missCount = 0;
let activeNotes = [];
let effects = [];

// [시작 화면] -> [곡 선택 화면] 이동
function goToSongSelect() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.remove('hidden');
  document.getElementById('result-screen').classList.add('hidden');
}

// [곡 선택 화면] -> [게임 화면] 진입 및 플레이 시작
function startGame(songKey) {
  activeSongKey = songKey;
  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  missCount = 0;
  effects = [];
  
  const selectedSong = songs[songKey];
  activeNotes = selectedSong.pattern.map(n => ({ ...n, hit: false, missed: false }));
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  document.getElementById('score').innerText = '000000';
  document.getElementById('combo').innerText = '0';

  currentBgm.src = selectedSong.src;
  currentBgm.currentTime = 0;
  currentBgm.play().catch(err => console.log(err));
  currentBgm.onended = () => { endGame(); };

  isPlaying = true;
  startTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score').innerText = String(score).padStart(6, '0');
  document.getElementById('combo').innerText = combo;
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgeLineY - 15,
    text: text,
    alpha: 1.0
  });
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  const currentTime = (timestamp - startTime) / 1000;

  if (currentTime >= 97.0) {
    endGame();
    return;
  }

  ctx.clearRect(0, 0, width, height);

  if (isBgLoaded) {
    ctx.drawImage(bgImage, 0, 0, width, height);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, width, height);
  } else {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, width, height);
  }

  ctx.strokeStyle = 'rgba(255, 105, 199, 0.25)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  ctx.strokeStyle = '#FF69C7';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();

  activeNotes.forEach(note => {
    if (note.hit) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - (timeDiff * NOTE_SPEED);
    const noteHeight = 18;

    if (timeDiff < -0.18 && !note.missed) {
      note.missed = true;
      combo = 0;
      missCount++;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    if (noteY > -20 && noteY < height + 20 && !note.missed) {
      const x = note.lane * laneWidth + 6;
      const w = laneWidth - 12;
      const mainColor = (note.lane === 0 || note.lane === 3) ? '#FF69C7' : '#ffd700';

      ctx.save();
      ctx.shadowColor = mainColor;
      ctx.shadowBlur = 15;

      ctx.fillStyle = mainColor;
      ctx.fillRect(x, noteY - noteHeight / 2, w, noteHeight);

      ctx.restore();
    }
  });

  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.fillStyle = eff.text === 'MISS' ? `rgba(255, 0, 0, ${eff.alpha})` : `rgba(255, 215, 0, ${eff.alpha})`;
    ctx.font = '12px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(eff.text, eff.x, eff.y);

    eff.y -= 1;
    eff.alpha -= 0.04;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  requestAnimationFrame(gameLoop);
}

function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = (performance.now() - startTime) / 1000;
  const target = activeNotes.find(n => n.lane === lane && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);
    
    if (diff <= 0.15) {
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      
      const isPerfect = diff <= 0.07;
      if (isPerfect) {
        perfectCount++;
        score += 1000;
      } else {
        greatCount++;
        score += 500;
      }
      
      addEffect(lane, isPerfect ? 'PERFECT' : 'GREAT');
      updateHUD();
    }
  }
}

function endGame() {
  if (!isPlaying) return;
  isPlaying = false;
  try { currentBgm.pause(); } catch(e) {}

  const resultScreen = document.getElementById('result-screen');
  resultScreen.innerHTML = `
    <div style="color: #ffffff; font-size: 3.5rem; margin-bottom: 10px;">CLEAR!</div>
    <div style="font-size: 0.65rem; line-height: 2.2; margin-bottom: 30px;">
      <p style="color:#ffd700;">PERFECT : ${perfectCount}</p>
      <p style="color:#fcd3f2;">GREAT   : ${greatCount}</p>
      <p style="color:#ff4444;">MISS    : ${missCount}</p>
      <p style="color:#ffffff;">MAX COMBO : ${maxCombo}</p>
    </div>
    <div><button class="start-btn" onclick="goToSongSelect()">SELECT SONG</button></div>
  `;
  resultScreen.classList.remove('hidden');
}

const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, 'D': 0, 'F': 1, 'J': 2, 'K': 3 };
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const lane = keyMap[e.key];
  if (lane !== undefined) triggerInput(lane);
});

canvas.addEventListener('touchstart', (e) => {
  if (!isPlaying) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const lane = Math.floor((e.touches[0].clientX - rect.left) / laneWidth);
  if (lane >= 0 && lane < 4) triggerInput(lane);
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  if (!isPlaying) return;
  const rect = canvas.getBoundingClientRect();
  const lane = Math.floor((e.clientX - rect.left) / laneWidth);
  if (lane >= 0 && lane < 4) triggerInput(lane);
});
</script>

</body>
</html>
