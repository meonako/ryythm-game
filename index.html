
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>82 Rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #000;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  font-family: 'Press Start 2P', cursive;
}

#game-container {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  background: #000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 2px solid #FF69C7;
  box-shadow: 0 0 20px rgba(255,105,199,.4);
}

#hud {
  height: 45px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;
  background: #000;
  border-bottom: 2px solid #FDC7FB;
  font-size: .7rem;
  z-index: 10;
}

#score { color: #ffd700; }
#combo { color: #fcd3f2; }

#canvas-wrapper {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
  background: #000;
  overflow: hidden;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  background: #000;
}

.screen {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  z-index: 999;
}

.hidden { display: none !important; }

h1 {
  color: #fcd3f2;
  font-size: 2rem;
  margin-bottom: 15px;
  line-height: 1.5;
  text-shadow: 3px 3px #FF69C7;
}

h2 {
  color: #fff;
  font-size: .75rem;
  margin-bottom: 25px;
}

.start-btn, .song-select-btn {
  background: transparent;
  color: #fff;
  border: none;
  padding: 12px 20px;
  font-size: .9rem;
  cursor: pointer;
  font-family: 'Press Start 2P', cursive;
  margin: 8px 0;
  touch-action: manipulation;
}

.start-btn:active, .song-select-btn:active {
  color: #FF69C7;
  transform: scale(1.05);
}

.song-select-btn {
  font-size: 1rem;
  margin-bottom: 20px;
  word-break: keep-all;
}
</style>
</head>

<body>
<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="screen">
      <h1>82 RHYTHM</h1>
      <h2>2026 WORK BY YUN</h2>
      <button id="start-game-btn" class="start-btn">START GAME</button>
    </div>

    <div id="song-select-screen" class="screen hidden">
      <h1>SELECT SONG</h1>
      <h2>CHOOSE YOUR TRACK</h2>
      <button class="song-select-btn" data-song="gossip">&gt; GOSSIP</button>
      <button class="song-select-btn" data-song="trembling">&gt; 떨리는 맘</button>
    </div>

    <div id="result-screen" class="screen hidden"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;

function resize() {
  width = canvas.width = wrapper.clientWidth;
  height = canvas.height = wrapper.clientHeight;
  laneWidth = width / 4;
  judgeLineY = height - 105;
}
window.addEventListener('resize', resize);
resize();

// 배경 이미지
const bgImage = new Image();
let isBgLoaded = false;

bgImage.onload = () => { isBgLoaded = true; };
bgImage.src = './cover.png';

function generatePattern(duration, bpm, offset, seed) {
  const pattern = [];
  const beat = 60 / bpm;
  let state = seed >>> 0;
  let previousLane = -1;
  let previousDouble = -1;

  function rand() {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  }

  function pickLane(exclude = []) {
    const choices = [0,1,2,3].filter(l => !exclude.includes(l));
    return choices[Math.floor(rand() * choices.length)];
  }

  let beatIndex = 0;

  for (let time = offset; time < duration - 0.2; time += beat, beatIndex++) {
    const variation = rand();

    if (variation < 0.10 && beatIndex % 4 !== 0) continue;

    const lane = pickLane([previousLane]);
    pattern.push({t: time, l: lane});
    previousLane = lane;

    if (rand() < 0.30) {
      const offbeat = time + beat / 2;
      if (offbeat < duration - 0.2) {
        const nextLane = pickLane([previousLane]);
        pattern.push({t: offbeat, l: nextLane});
        previousLane = nextLane;
      }
    }

    if (rand() < 0.13 && beatIndex !== previousDouble) {
      const secondLane = pickLane([lane]);
      pattern.push({t: time, l: secondLane});
      previousDouble = beatIndex;
    }
  }

  return pattern
    .sort((a,b) => a.t - b.t || a.l - b.l)
    .map(n => ({time: Number(n.t.toFixed(3)), lane: n.l}));
}

const songs = {
  gossip: {
    src: './Gossip.mp3',
    bg: './cover.png',
    pattern: generatePattern(93.06, 99.38, 3.90, 82)
  },
  trembling: {
    src: './trembling.mp3',
    bg: './images/Cover2.png',
    pattern: generatePattern(188.69, 78.30, 0.74, 27)
  }
};

let activeSongKey = 'gossip';
let currentBgm = new Audio();
const NOTE_SPEED = 550;

let isPlaying = false;
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let missCount = 0;
let activeNotes = [];
let effects = [];
let animationId = null;

// ------------------------------
// 판정 이펙트 시스템
// ------------------------------

function addEffect(lane, type) {
  const x = lane * laneWidth + laneWidth / 2;

  effects.push({
    x,
    y: judgeLineY,
    type,
    age: 0,
    duration: type === 'PERFECT' ? 650 : 500,
    seed: Math.random() * 1000
  });
}

// 별 모양 그리기
function drawStar(x, y, outerRadius, innerRadius, points, rotation) {
  ctx.beginPath();

  for (let i = 0; i < points * 2; i++) {
    const angle = rotation + i * Math.PI / points;
    const radius = i % 2 === 0 ? outerRadius : innerRadius;
    const px = x + Math.cos(angle) * radius;
    const py = y + Math.sin(angle) * radius;

    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.closePath();
}

function drawHitEffects(deltaTime) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.age += deltaTime;

    const progress = Math.min(e.age / e.duration, 1);
    const fade = 1 - progress;
    const perfect = e.type === 'PERFECT';

    const pink = '#FF72DC';
    const cyan = '#54F7FF';

    const primary = perfect ? pink : cyan;
    const secondary = perfect ? cyan : pink;

    ctx.save();
    ctx.globalAlpha = fade;

    // 1. 중심의 빛 번짐
    const glowRadius = 12 + progress * 48;
    const glow = ctx.createRadialGradient(
      e.x, e.y, 0,
      e.x, e.y, glowRadius
    );

    glow.addColorStop(0, 'rgba(255,255,255,0.95)');
    glow.addColorStop(0.22, perfect
      ? 'rgba(255,105,199,0.7)'
      : 'rgba(84,247,255,0.7)');
    glow.addColorStop(1, 'rgba(255,105,199,0)');

    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(e.x, e.y, glowRadius, 0, Math.PI * 2);
    ctx.fill();

    // 2. 바깥쪽으로 커지는 네온 링
    for (let ring = 0; ring < 2; ring++) {
      const ringProgress = Math.min(1, progress + ring * 0.18);
      const radius = 12 + ringProgress * (perfect ? 65 : 45);

      ctx.beginPath();
      ctx.ellipse(
        e.x, e.y,
        radius,
        radius * 0.60,
        0, 0, Math.PI * 2
      );

      ctx.strokeStyle = ring === 0 ? primary : secondary;
      ctx.lineWidth = ring === 0 ? 4 * fade + 0.5 : 2 * fade + 0.5;
      ctx.shadowColor = ctx.strokeStyle;
      ctx.shadowBlur = 18;
      ctx.stroke();
    }

    ctx.shadowBlur = 0;

    // 3. 중심에서 퍼지는 빛줄기
    const rayCount = perfect ? 12 : 8;

    for (let r = 0; r < rayCount; r++) {
      const angle = (Math.PI * 2 * r / rayCount) + e.seed;
      const inner = 12 + progress * 14;
      const outer = inner + (1 - progress) * (perfect ? 48 : 30);

      ctx.beginPath();
      ctx.moveTo(
        e.x + Math.cos(angle) * inner,
        e.y + Math.sin(angle) * inner
      );
      ctx.lineTo(
        e.x + Math.cos(angle) * outer,
        e.y + Math.sin(angle) * outer
      );

      ctx.strokeStyle = r % 2 === 0 ? '#FFFFFF' : primary;
      ctx.lineWidth = r % 3 === 0 ? 3 * fade + 0.2 : 1.5 * fade;
      ctx.shadowColor = primary;
      ctx.shadowBlur = 10;
      ctx.stroke();
    }

    // 4. 사방으로 흩어지는 별빛
    const starCount = perfect ? 12 : 8;

    for (let s = 0; s < starCount; s++) {
      const angle = (Math.PI * 2 * s / starCount) + e.seed;
      const distance = 10 + progress * (perfect ? 65 : 45);

      const sx = e.x + Math.cos(angle) * distance;
      const sy = e.y + Math.sin(angle) * distance * 0.68;
      const size = (perfect ? 7 : 5) * fade + 0.4;

      drawStar(sx, sy, size, size * 0.35, 4, angle);
      ctx.fillStyle = s % 2 === 0 ? '#FFFFFF' : secondary;
      ctx.shadowColor = primary;
      ctx.shadowBlur = 12;
      ctx.fill();
    }

    // 5. 중앙의 밝은 플래시
    if (progress < 0.25) {
      const flashAlpha = 1 - progress / 0.25;
      ctx.globalAlpha = flashAlpha * 0.8;

      const flash = ctx.createRadialGradient(
        e.x, e.y, 0, e.x, e.y, 35
      );
      flash.addColorStop(0, '#FFFFFF');
      flash.addColorStop(0.3, primary);
      flash.addColorStop(1, 'rgba(255,255,255,0)');

      ctx.fillStyle = flash;
      ctx.beginPath();
      ctx.arc(e.x, e.y, 35, 0, Math.PI * 2);
      ctx.fill();
    }

    // 6. PERFECT / GREAT 판정 텍스트
    ctx.globalAlpha = fade;
    ctx.font = '10px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = primary;
    ctx.shadowBlur = 12;
    ctx.fillText(
      e.type,
      e.x,
      e.y - 35 - progress * 22
    );

    ctx.restore();

    if (e.age >= e.duration) {
      effects.splice(i, 1);
    }
  }
}

// ------------------------------
// 화면 전환
// ------------------------------

function goToSongSelect() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.remove('hidden');
  document.getElementById('result-screen').classList.add('hidden');
}

function startGame(songKey) {
  activeSongKey = songKey;
  const song = songs[songKey];
  if (!song) return;

  if (animationId !== null) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  isPlaying = false;
  currentBgm.pause();

  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  missCount = 0;
  effects = [];

  isBgLoaded = false;
  bgImage.onload = () => { isBgLoaded = true; };
  bgImage.onerror = () => { isBgLoaded = false; };
  bgImage.src = song.bg;

  activeNotes = song.pattern.map(n => ({
    ...n,
    hit: false,
    missed: false
  }));

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  document.getElementById('score').innerText = '000000';
  document.getElementById('combo').innerText = '0';

  currentBgm = new Audio(song.src);
  currentBgm.preload = 'auto';

  currentBgm.onended = endGame;

  isPlaying = true;

  currentBgm.play().catch(error => {
    console.log('Audio playback error:', error);
  });

  lastFrameTime = performance.now();
  animationId = requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score').innerText =
    String(score).padStart(6, '0');

  document.getElementById('combo').innerText = combo;
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  const deltaTime = Math.min(timestamp - lastFrameTime, 40);
  lastFrameTime = timestamp;

  const currentTime = currentBgm.currentTime;

  ctx.clearRect(0, 0, width, height);

  // 배경
  if (isBgLoaded && bgImage.complete && bgImage.naturalWidth > 0) {
    ctx.drawImage(bgImage, 0, 0, width, height);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, width, height);
  } else {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, width, height);
  }

  // 4개 레인
  ctx.strokeStyle = 'rgba(255,105,199,0.25)';
  ctx.lineWidth = 2;

  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  // 판정선
  ctx.strokeStyle = '#FF69C7';
  ctx.lineWidth = 4;
  ctx.shadowColor = '#FF69C7';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // 노트
  activeNotes.forEach(note => {
    if (note.hit || note.missed) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - timeDiff * NOTE_SPEED;
    const noteHeight = 18;

    if (timeDiff < -0.18) {
      note.missed = true;
      combo = 0;
      missCount++;

      // MISS도 작은 빨간 빛으로 표시
      effects.push({
        x: note.lane * laneWidth + laneWidth / 2,
        y: judgeLineY,
        type: 'MISS',
        age: 0,
        duration: 450,
        seed: 0
      });

      updateHUD();
      return;
    }

    if (noteY > -20 && noteY < height + 20) {
      const x = note.lane * laneWidth + 6;
      const w = laneWidth - 12;
      const color =
        note.lane === 0 || note.lane === 3
          ? '#FDC7FB'
          : '#54F7FF';

      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 15;
      ctx.fillStyle = color;
      ctx.fillRect(x, noteY - noteHeight / 2, w, noteHeight);
      ctx.restore();
    }
  });

  // 판정 이펙트는 노트 위에 그린다.
  drawHitEffects(deltaTime);

  animationId = requestAnimationFrame(gameLoop);
}

let lastFrameTime = 0;

// ------------------------------
// 노트 판정
// ------------------------------

function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = currentBgm.currentTime;

  const target = activeNotes.find(n =>
    n.lane === lane && !n.hit && !n.missed
  );

  if (!target) return;

  const diff = Math.abs(target.time - currentTime);

  if (diff <= 0.15) {
    target.hit = true;
    combo++;

    if (combo > maxCombo) maxCombo = combo;

    const isPerfect = diff <= 0.07;

    if (isPerfect) {
      perfectCount++;
      score += 1000;
      addEffect(lane, 'PERFECT');
    } else {
      greatCount++;
      score += 500;
      addEffect(lane, 'GREAT');
    }

    updateHUD();
  }
}

// ------------------------------
// 결과 화면
// ------------------------------

function endGame() {
  if (!isPlaying) return;

  isPlaying = false;
  currentBgm.pause();

  const totalNotes = songs[activeSongKey].pattern.length;
  const accuracy = totalNotes > 0
    ? (score / (totalNotes * 1000)) * 100
    : 0;

  let rank = 'F';
  let message = '"STAGE FAILED... TRY AGAIN!"';
  let shadowColor = '#ff4444';

  if (accuracy >= 90) {
    rank = 'S';
    message = '"AMAZING! PERFECT RHYTHM!"';
    shadowColor = '#ffd700';
  } else if (accuracy >= 80) {
    rank = 'A';
    message = '"GREAT JOB!"';
    shadowColor = '#FD5DBD';
  } else if (accuracy >= 70) {
    rank = 'B';
    message = '"GOOD!"';
    shadowColor = '#00fff2';
  } else if (accuracy >= 60) {
    rank = 'C';
    message = '"CLEAR!"';
    shadowColor = '#ff8800';
  }

  const resultScreen = document.getElementById('result-screen');

  resultScreen.innerHTML = `
    <div style="font-size:4.5rem;color:white;text-shadow:0 0 15px ${shadowColor};margin-bottom:5px">${rank}</div>
    <div style="font-size:.65rem;color:#fcd3f2;margin-bottom:20px">${message}</div>
    <div style="font-size:.65rem;line-height:2.2;margin-bottom:25px;text-align:left">
      <p style="color:#54F7FF">PERFECT : ${perfectCount}</p>
      <p style="color:#fcd3f2">GREAT : ${greatCount}</p>
      <p style="color:#ff4444">MISS : ${missCount}</p>
      <hr style="border:0;border-top:1px solid #555;margin:5px 0">
      <p>MAX COMBO : ${maxCombo}</p>
      <p>SCORE : ${score}</p>
    </div>
    <button id="retry-btn" class="start-btn">RETRY</button>
    <button id="select-song-btn" class="start-btn">SELECT SONG</button>
  `;

  resultScreen.classList.remove('hidden');

  document.getElementById('retry-btn').onclick =
    () => startGame(activeSongKey);

  document.getElementById('select-song-btn').onclick =
    goToSongSelect;
}

// ------------------------------
// 버튼 이벤트
// ------------------------------

document.getElementById('start-game-btn').addEventListener(
  'click',
  goToSongSelect
);

document.querySelectorAll('.song-select-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    startGame(btn.dataset.song);
  });
});

// ------------------------------
// 키보드: D F J K
// ------------------------------

const keyMap = {
  d: 0,
  f: 1,
  j: 2,
  k: 3
};

window.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();

  if (!(key in keyMap)) return;

  e.preventDefault();

  if (!isPlaying || e.repeat) return;

  triggerInput(keyMap[key]);
}, true);

// ------------------------------
// 터치 및 마우스 입력
// ------------------------------

function handlePointerInput(clientX) {
  if (!isPlaying) return;

  const rect = canvas.getBoundingClientRect();
  const lane = Math.floor(
    (clientX - rect.left) / rect.width * 4
  );

  if (lane >= 0 && lane < 4) {
    triggerInput(lane);
  }
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  handlePointerInput(e.clientX);
});

</script>
</body>
</html>
