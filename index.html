<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>82 Rhythm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Press Start 2P', cursive;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      padding: 18px 15px 12px 15px;
      background-color: #000000;
      border-bottom: none;
      font-size: 0.75rem;
      z-index: 5;
    }

    #score { color: #ffd700; }
    #combo { color: #fcd3f2; }

    #canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      background-color: #000000;
    }

    canvas {
      position: relative;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background-color: #000000;
      z-index: 2;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000000; 
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 999;
    }

    .hidden { display: none !important; }

    h1 {
      color: #fcd3f2;
      font-size: 2.0rem;
      margin-bottom: 10px;
      line-height: 1.5;
      text-shadow: 3px 3px #FF69C7;
    }

    /* 곡 선택 버튼 스타일 */
    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      width: 80%;
    }

    .song-btn {
      background-color: #111;
      color: #ffffff;
      border: 2px solid #FF69C7;
      padding: 10px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: 0.1s;
    }

    .song-btn:hover, .song-btn.selected {
      background-color: #FF69C7;
      color: #000;
    }

    .start-btn {
      background-color: #ffd700;
      color: #000000;
      border: none;
      padding: 12px 25px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: bold;
    }

    .start-btn:active {
      transform: scale(0.98);
    }
     
    h2 {
      color: #ffffff;
      font-size: 0.65rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- 시작 및 곡 선택 화면 -->
    <div id="start-screen" class="screen">
      <h1>82 RHYTHM</h1>
      <h2>SELECT YOUR SONG</h2>
      
      <!-- 곡 목록 버튼들 -->
      <div class="song-list" id="song-list-container">
        <!-- 자바스크립트로 동적 생성됨 -->
      </div>

      <button class="start-btn" onclick="startGame()">START GAME</button>
    </div>

    <div id="result-screen" class="screen hidden"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;

function resize() {
  width = canvas.width = wrapper.clientWidth;
  height = canvas.height = wrapper.clientHeight;
  laneWidth = width / 4;
  judgeLineY = height - 105;
}
window.addEventListener('resize', resize);
resize();

// ==========================================
// 곡 데이터 리스트 (여기에 곡을 계속 추가하면 됩니다!)
// ==========================================
const songList = [
  {
    title: "1. Gossip",
    audioSrc: "./Gossip.mp3",
    bgSrc: "./Cover.png",
    pattern: [
      {t: 4.2, l: 0}, {t: 4.9, l: 3}, {t: 5.4, l: 1}, {t: 6.1, l: 2}, {t: 7.0, l: 0},
      {t: 7.8, l: 3}, {t: 8.6, l: 2}, {t: 9.2, l: 1}, {t: 10.1, l: 0}, {t: 10.9, l: 3},
      {t: 11.6, l: 1}, {t: 12.4, l: 2}, {t: 13.2, l: 0}, {t: 14.0, l: 3}, {t: 14.8, l: 1},
      {t: 15.3, l: 2}, {t: 15.7, l: 0}, {t: 16.4, l: 3}, {t: 17.1, l: 1}, {t: 17.7, l: 2},
      {t: 18.4, l: 0}, {t: 19.1, l: 3}, {t: 19.8, l: 1}, {t: 20.5, l: 2}, {t: 21.2, l: 0},
      {t: 21.9, l: 3}, {t: 22.5, l: 1}, {t: 23.2, l: 2}, {t: 24.0, l: 0}, {t: 24.7, l: 3}
    ]
  },
  {
    title: "2. 떨리는 맘",
    audioSrc: "./떨리는 맘.mp3", // 실제 파일명으로 변경
    bgSrc: "./Cover2.png",   // 실제 이미지명으로 변경
    pattern: [
      {t: 3.0, l: 1}, {t: 4.0, l: 2}, {t: 5.0, l: 0}, {t: 6.0, l: 3}
    ]
  }
];

let currentSongIndex = 0; // 현재 선택된 곡 번호

const bgImage = new Image();
let isBgLoaded = false;
bgImage.onload = () => { isBgLoaded = true; };

const bgm = new Audio();
const NOTE_SPEED = 550;

let SONG_PATTERN = [];
let isPlaying = false;
let startTime = 0;
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let missCount = 0;
let activeNotes = [];
let effects = [];

// 곡 선택 화면 UI 생성
function initSongSelector() {
  const container = document.getElementById('song-list-container');
  container.innerHTML = '';
  
  songList.forEach((song, index) => {
    const btn = document.createElement('button');
    btn.className = `song-btn ${index === currentSongIndex ? 'selected' : ''}`;
    btn.innerText = song.title;
    btn.onclick = () => {
      currentSongIndex = index;
      initSongSelector(); // 선택 표시 업데이트
    };
    container.appendChild(btn);
  });
}
initSongSelector();

// 게임 시작 함수 (선택한 곡 정보를 로드)
function startGame() {
  const selectedSong = songList[currentSongIndex];
  
  bgm.src = selectedSong.audioSrc;
  bgImage.src = selectedSong.bgSrc;
  SONG_PATTERN = selectedSong.pattern;

  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  missCount = 0;
  effects = [];
  
  activeNotes = SONG_PATTERN.map(n => ({ ...n, hit: false, missed: false }));
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  document.getElementById('score').innerText = '000000';
  document.getElementById('combo').innerText = '0';

  bgm.currentTime = 0;
  bgm.play().catch(err => console.log(err));
  bgm.onended = () => { endGame(); };

  isPlaying = true;
  startTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score').innerText = String(score).padStart(6, '0');
  document.getElementById('combo').innerText = combo;
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgeLineY - 15,
    text: text,
    alpha: 1.0
  });
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  const currentTime = (timestamp - startTime) / 1000;
  const lastNoteTime = SONG_PATTERN[SONG_PATTERN.length - 1].time + 3.0;

  if (currentTime >= lastNoteTime) {
    endGame();
    return;
  }

  ctx.clearRect(0, 0, width, height);

  if (isBgLoaded) {
    ctx.drawImage(bgImage, 0, 0, width, height);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillRect(0, 0, width, height);
  } else {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, width, height);
  }

  ctx.strokeStyle = 'rgba(255, 105, 199, 0.25)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  ctx.strokeStyle = '#FF69C7';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();

  activeNotes.forEach(note => {
    if (note.hit) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - (timeDiff * NOTE_SPEED);
    const noteHeight = 18;

    if (timeDiff < -0.18 && !note.missed) {
      note.missed = true;
      combo = 0;
      missCount++;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    if (noteY > -20 && noteY < height + 20 && !note.missed) {
      const x = note.lane * laneWidth + 6;
      const w = laneWidth - 12;
      const mainColor = (note.lane === 0 || note.lane === 3) ? '#FF69C7' : '#ffd700';

      ctx.save();
      ctx.shadowColor = mainColor;
      ctx.shadowBlur = 15;
      ctx.fillStyle = mainColor;
      ctx.fillRect(x, noteY - noteHeight / 2, w, noteHeight);
      ctx.restore();
    }
  });

  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.fillStyle = eff.text === 'MISS' ? `rgba(255, 0, 0, ${eff.alpha})` : `rgba(255, 215, 0, ${eff.alpha})`;
    ctx.font = '12px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(eff.text, eff.x, eff.y);

    eff.y -= 1;
    eff.alpha -= 0.04;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  requestAnimationFrame(gameLoop);
}

function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = (performance.now() - startTime) / 1000;
  const target = activeNotes.find(n => n.lane === lane && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);
    
    if (diff <= 0.15) {
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      
      const isPerfect = diff <= 0.07;
      if (isPerfect) {
        perfectCount++;
        score += 1000;
      } else {
        greatCount++;
        score += 500;
      }
      
      addEffect(lane, isPerfect ? 'PERFECT' : 'GREAT');
      updateHUD();
    }
  }
}

function endGame() {
  if (!isPlaying) return;
  isPlaying = false;
  try { bgm.pause(); } catch(e) {}

  const resultScreen = document.getElementById('result-screen');
  resultScreen.innerHTML = `
    <div style="color: #ffffff; font-size: 3.5rem; margin-bottom: 10px;">CLEAR!</div>
    <div style="font-size: 0.65rem; line-height: 2.2; margin-bottom: 30px;">
      <p style="color:#ffd700;">PERFECT : ${perfectCount}</p>
      <p style="color:#fcd3f2;">GREAT   : ${greatCount}</p>
      <p style="color:#ff4444;">MISS    : ${missCount}</p>
      <p style="color:#ffffff;">MAX COMBO : ${maxCombo}</p>
    </div>
    <div><button class="start-btn" onclick="location.reload()">BACK TO MENU</button></div>
  `;
  resultScreen.classList.remove('hidden');
}

const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, 'D': 0, 'F': 1, 'J': 2, 'K': 3 };
window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const lane = keyMap[e.key];
  if (lane !== undefined) triggerInput(lane);
});

canvas.addEventListener('touchstart', (e) => {
  if (!isPlaying) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const lane = Math.floor((e.touches[0].clientX - rect.left) / laneWidth);
  if (lane >= 0 && lane < 4) triggerInput(lane);
}, { passive: false });

canvas.addEventListener('mousedown', (e) => {
  if (!isPlaying) return;
  const rect = canvas.getBoundingClientRect();
  const lane = Math.floor((e.clientX - rect.left) / laneWidth);
  if (lane >= 0 && lane < 4) triggerInput(lane);
});
</script>

</body>
</html>
