<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모바일 4레인 리듬게임</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100%;
      margin: 0 auto;
      background: #1a1a24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(15, 15, 25, 0.92);
      z-index: 10;
      padding: 20px;
    }

    .hidden { display: none !important; }

    h1 { font-size: 2rem; color: #00f0ff; margin-bottom: 20px; text-shadow: 0 0 10px #00f0ff; }
    p { margin-bottom: 15px; color: #ccc; font-size: 0.95rem; text-align: center; }

    .btn {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,240,255,0.4);
      margin: 8px;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 5;
      font-weight: bold;
      font-size: 1.1rem;
      pointer-events: none;
    }

    #score-display { color: #fff; }
    #combo-display { color: #ff007f; font-size: 1.3rem; }

    #touch-controls {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 18%;
      display: flex;
      z-index: 4;
    }

    .touch-pad {
      flex: 1;
      border-top: 2px solid rgba(255,255,255,0.3);
      border-right: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.5);
    }

    .touch-pad:active, .touch-pad.active {
      background: rgba(0, 240, 255, 0.3);
    }

    #start-btn:active {
      transform: scale(0.95);
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="score-display">000000</div>
    <div id="combo-display"></div>
  </div>

  <div id="touch-controls">
    <div class="touch-pad" id="pad-0">D</div>
    <div class="touch-pad" id="pad-1">F</div>
    <div class="touch-pad" id="pad-2">J</div>
    <div class="touch-pad" id="pad-3">K</div>
  </div>

  <!-- 메인 대기 화면 -->
  <div id="start-screen" class="screen">
    <h1>4-LANE RHYTHM</h1>
    <p>모바일 터치 또는 키보드 (D, F, J, K)로 플레이하세요.</p>
    
    <!-- 버튼 이미지 (images/start_btn.png 가 없으면 기본 버튼으로 보임) -->
    <img src="./images/start_btn.png" id="start-btn" alt="GAME START" 
         onerror="this.style.display='none'; document.getElementById('start-btn-fallback').style.display='block';"
         style="width: 200px; cursor: pointer; display: block; margin: 15px auto; transition: transform 0.1s;">
    
    <!-- 이미지 로드 실패 시 나타나는 기본 대체 버튼 -->
    <button class="btn" id="start-btn-fallback" style="display: none;">GAME START</button>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen" class="screen hidden">
    <h1>CLEAR!</h1>
    <p id="result-score" style="font-size: 1.5rem; color:#fff;"></p>
    <p id="result-combo" style="color:#ff007f;"></p>
    <button class="btn" id="retry-btn">RETRY</button>
  </div>
</div>

<script>
// ==========================================
// 1. 에셋 경로 설정 (파일명 대소문자 확인!)
// ==========================================
const ASSETS_CONFIG = {
  bg: './images/bg.jpg', 
  audio: './audio/Gossip.mp3', // 최상위에 올려둔 MP3 파일명
  notes: [
    './assets/note_red.png',
    './assets/note_blue.png',
    './assets/note_blue.png',
    './assets/note_red.png'
  ]
};

// ==========================================
// 2. 노트 채보 데이터
// ==========================================
const DEMO_SONG = {
  bpm: 120,
  notes: [
    { time: 1.0, lane: 0 },
    { time: 1.5, lane: 1 },
    { time: 2.0, lane: 2 },
    { time: 2.5, lane: 3 },
    { time: 3.0, lane: 1 },
    { time: 3.0, lane: 2 },
    { time: 3.5, lane: 0 },
    { time: 4.0, lane: 3 },
    { time: 4.5, lane: 1 },
    { time: 5.0, lane: 2 },
    { time: 5.5, lane: 0 },
    { time: 5.5, lane: 3 },
    { time: 6.0, lane: 1 },
    { time: 6.5, lane: 2 },
    { time: 7.0, lane: 0 },
    { time: 7.5, lane: 3 }
  ]
};

// ==========================================
// 3. 변수 및 오디오 객체 설정
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let containerWidth, containerHeight;
let laneWidth, judgmentLineY;
let speed = 600;

let audioCtx = null;
let bgmAudio = new Audio(); // BGM 오디오 객체
let isPlaying = false;
let gameStartTime = 0;
let countdown = 3;

let score = 0;
let combo = 0;
let maxCombo = 0;
let liveNotes = [];
let effects = [];

const loadedImages = { bg: null, notes: [] };

function loadAssets() {
  const bgImg = new Image();
  bgImg.src = ASSETS_CONFIG.bg;
  bgImg.onload = () => { loadedImages.bg = bgImg; };

  ASSETS_CONFIG.notes.forEach((path, idx) => {
    const img = new Image();
    img.src = path;
    img.onload = () => { loadedImages.notes[idx] = img; };
  });
}
loadAssets();

function resizeCanvas() {
  const container = document.getElementById('game-container');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  containerWidth = canvas.width;
  containerHeight = canvas.height;
  laneWidth = containerWidth / 4;
  judgmentLineY = containerHeight * 0.82;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playBeep(freq = 440, type = 'sine', duration = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ==========================================
// 4. 게임 시작 및 오디오 강제 재생 로직
// ==========================================
function startGame() {
  initAudio();

  // 음악 사전 로드 및 사용자 터치 권한으로 즉시 실행 테스트
  bgmAudio.src = ASSETS_CONFIG.audio;
  bgmAudio.load();

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  score = 0;
  combo = 0;
  maxCombo = 0;
  effects = [];
  updateHUD();

  liveNotes = DEMO_SONG.notes.map(n => ({
    ...n,
    hit: false,
    missed: false
  }));

  isPlaying = true;
  countdown = 3;

  const countInterval = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      playBeep(600, 'sine', 0.1);
    } else if (countdown === 0) {
      playBeep(1200, 'triangle', 0.2);
      clearInterval(countInterval);
      
      // 카운트다운 끝난 후 BGM 재생
      bgmAudio.currentTime = 0;
      const playPromise = bgmAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.log("오디오 재생 실패:", error);
          alert("음악 파일(Gossip.mp3)을 불러오지 못했습니다. 파일명과 대소문자를 확인해 주세요!");
        });
      }
      gameStartTime = performance.now();
    }
  }, 1000);

  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score-display').innerText = String(score).padStart(6, '0');
  document.getElementById('combo-display').innerText = combo > 2 ? `${combo} COMBO` : '';
}

function handleInput(laneIndex) {
  if (!isPlaying || countdown > 0) return;

  const currentTime = (performance.now() - gameStartTime) / 1000;
  playBeep(300 + laneIndex * 100, 'square', 0.05);

  const target = liveNotes.find(n => n.lane === laneIndex && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);
    if (diff <= 0.12) {
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const pts = diff <= 0.06 ? 1000 : 700;
      score += pts;
      addEffect(laneIndex, diff <= 0.06 ? 'PERFECT' : 'GREAT');
      updateHUD();
    }
  }
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgmentLineY - 20,
    text: text,
    alpha: 1.0
  });
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  ctx.clearRect(0, 0, containerWidth, containerHeight);

  if (loadedImages.bg) {
    ctx.drawImage(loadedImages.bg, 0, 0, containerWidth, containerHeight);
  } else {
    ctx.fillStyle = '#11111d';
    ctx.fillRect(0, 0, containerWidth, containerHeight);
  }

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, containerHeight);
    ctx.stroke();
  }

  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgmentLineY);
  ctx.lineTo(containerWidth, judgmentLineY);
  ctx.stroke();

  if (countdown > 0) {
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 60px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(countdown, containerWidth / 2, containerHeight / 2);
    requestAnimationFrame(gameLoop);
    return;
  }

  const currentTime = (performance.now() - gameStartTime) / 1000;

  liveNotes.forEach(note => {
    if (note.hit) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgmentLineY - (timeDiff * speed);
    const noteHeight = 25;

    if (timeDiff < -0.2 && !note.missed) {
      note.missed = true;
      combo = 0;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    if (noteY > -50 && noteY < containerHeight + 50 && !note.missed) {
      const noteX = note.lane * laneWidth + 4;
      const noteW = laneWidth - 8;

      if (loadedImages.notes[note.lane]) {
        ctx.drawImage(loadedImages.notes[note.lane], noteX, noteY - noteHeight/2, noteW, noteHeight);
      } else {
        ctx.fillStyle = note.lane % 2 === 0 ? '#ff0055' : '#00ccff';
        ctx.beginPath();
        ctx.roundRect(noteX, noteY - noteHeight/2, noteW, noteHeight, 6);
        ctx.fill();
      }
    }
  });

  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.fillStyle = eff.text === 'MISS' ? `rgba(255, 0, 0, ${eff.alpha})` : `rgba(0, 240, 255, ${eff.alpha})`;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(eff.text, eff.x, eff.y);

    eff.y -= 1;
    eff.alpha -= 0.03;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  const lastNoteTime = DEMO_SONG.notes[DEMO_SONG.notes.length - 1].time;
  if (currentTime > lastNoteTime + 2.0) {
    endGame();
    return;
  }

  requestAnimationFrame(gameLoop);
}

function endGame() {
  isPlaying = false;
  try {
    bgmAudio.pause();
  } catch(e) {}
  document.getElementById('result-score').innerText = `SCORE: ${score}`;
  document.getElementById('result-combo').innerText = `MAX COMBO: ${maxCombo}`;
  document.getElementById('result-screen').classList.remove('hidden');
}

// ==========================================
// 5. 이벤트 리스너 등록
// ==========================================
const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, '1': 0, '2': 1, '3': 2, '4': 3 };

window.addEventListener('keydown', (e) => {
  const lane = keyMap[e.key.toLowerCase()];
  if (lane !== undefined) {
    const pad = document.getElementById(`pad-${lane}`);
    if (pad) pad.classList.add('active');
    handleInput(lane);
  }
});

window.addEventListener('keyup', (e) => {
  const lane = keyMap[e.key.toLowerCase()];
  if (lane !== undefined) {
    const pad = document.getElementById(`pad-${lane}`);
    if (pad) pad.classList.remove('active');
  }
});

[0, 1, 2, 3].forEach(lane => {
  const pad = document.getElementById(`pad-${lane}`);
  pad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    pad.classList.add('active');
    handleInput(lane);
  });
  pad.addEventListener('touchend', (e) => {
    e.preventDefault();
    pad.classList.remove('active');
  });
});

// 시작 버튼 클릭/터치 이벤트 (버튼 이미지 + 대체 버튼 둘 다 지원)
const startBtn = document.getElementById('start-btn');
const fallbackBtn = document.getElementById('start-btn-fallback');

if (startBtn) startBtn.addEventListener('click', startGame);
if (fallbackBtn) fallbackBtn.addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
</script>
</body>
</html>
