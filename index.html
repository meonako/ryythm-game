
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>82 Rhythm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  user-select: none;
  -webkit-user-select: none;
}

body {
  background: #000;
  color: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  font-family: 'Press Start 2P', cursive;
}

#game-container {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  background: #000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border: 2px solid #FF69C7;
  box-shadow: 0 0 20px rgba(255,105,199,.4);
}

#hud {
  height: 45px;
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;
  background: #000;
  border-bottom: 2px solid #FDC7FB;
  font-size: .7rem;
  z-index: 10;
}

#score { color: #ffd700; }
#combo { color: #fcd3f2; }

#canvas-wrapper {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
  background: #000;
  overflow: hidden;
}

canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  background: #000;
  z-index: 2;
}

.screen {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  z-index: 999;
}

.hidden { display: none !important; }

h1 {
  color: #fcd3f2;
  font-size: 2rem;
  margin-bottom: 15px;
  line-height: 1.5;
  text-shadow: 3px 3px #FF69C7;
}

h2 {
  color: #fff;
  font-size: .75rem;
  margin-bottom: 25px;
}

.start-btn,
.song-select-btn {
  background: transparent;
  color: #fff;
  border: none;
  font-family: 'Press Start 2P', cursive;
  cursor: pointer;
  padding: 12px 20px;
  margin: 8px 0;
  transition: .1s;
}

.start-btn { font-size: .9rem; }

.song-select-btn {
  font-size: 1rem;
  margin-bottom: 20px;
  word-break: keep-all;
}

.start-btn:active,
.song-select-btn:active {
  color: #FF69C7;
  transform: scale(1.05);
}
</style>
</head>

<body>
<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <div id="start-screen" class="screen">
      <h1>82 RHYTHM</h1>
      <h2>2026 WORK BY YUN</h2>
      <button id="start-game-btn" class="start-btn">START GAME</button>
    </div>

    <div id="song-select-screen" class="screen hidden">
      <h1>SELECT SONG</h1>
      <h2>CHOOSE YOUR TRACK</h2>
      <button class="song-select-btn" data-song="gossip">&gt; GOSSIP</button>
      <button class="song-select-btn" data-song="trembling">&gt; 떨리는 맘</button>
    </div>

    <div id="result-screen" class="screen hidden"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  width = wrapper.clientWidth;
  height = wrapper.clientHeight;

  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  canvas.style.width = width + 'px';
  canvas.style.height = height + 'px';

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  laneWidth = width / 4;
  judgeLineY = height - 105;
}

window.addEventListener('resize', resize);
resize();

/* ---------- 배경 ---------- */

const bgImage = new Image();
let isBgLoaded = false;

bgImage.onload = () => { isBgLoaded = true; };
bgImage.onerror = () => { isBgLoaded = false; };
bgImage.src = './cover.png';

/* ---------- 채보 ---------- */

function generatePattern(duration, bpm, offset, seed) {
  const pattern = [];
  const beat = 60 / bpm;

  let state = seed >>> 0;
  let previousLane = -1;
  let previousDouble = -1;

  function rand() {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  }

  function pickLane(exclude = []) {
    const choices = [0,1,2,3].filter(
      lane => !exclude.includes(lane)
    );
    return choices[Math.floor(rand() * choices.length)];
  }

  let beatIndex = 0;

  for (
    let time = offset;
    time < duration - 0.2;
    time += beat, beatIndex++
  ) {
    const variation = rand();

    if (variation < 0.10 && beatIndex % 4 !== 0) {
      continue;
    }

    const lane = pickLane([previousLane]);
    pattern.push({ t: time, l: lane });
    previousLane = lane;

    if (rand() < 0.30) {
      const offbeat = time + beat / 2;

      if (offbeat < duration - 0.2) {
        const nextLane = pickLane([previousLane]);
        pattern.push({ t: offbeat, l: nextLane });
        previousLane = nextLane;
      }
    }

    if (rand() < 0.13 && beatIndex !== previousDouble) {
      const secondLane = pickLane([lane]);
      pattern.push({ t: time, l: secondLane });
      previousDouble = beatIndex;
    }
  }

  return pattern
    .sort((a, b) => a.t - b.t || a.l - b.l)
    .map(note => ({
      time: Number(note.t.toFixed(3)),
      lane: note.l
    }));
}

const songs = {
  gossip: {
    src: './Gossip.mp3',
    bg: './cover.png',
    pattern: generatePattern(93.06, 99.38, 3.90, 82)
  },
  trembling: {
    src: './trembling.mp3',
    bg: './images/Cover2.png',
    pattern: generatePattern(188.69, 78.30, 0.74, 27)
  }
};

let activeSongKey = 'gossip';
let currentBgm = new Audio();
currentBgm.preload = 'auto';
const NOTE_SPEED = 550;

let isPlaying = false;
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let missCount = 0;

let activeNotes = [];
let effects = [];
let lastFrameTime = 0;

/* ---------- 화면 전환 ---------- */

function goToSongSelect() {
  isPlaying = false;
  currentBgm.pause();

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.remove('hidden');
  document.getElementById('result-screen').classList.add('hidden');
}

function updateHUD() {
  document.getElementById('score').innerText =
    String(score).padStart(6, '0');

  document.getElementById('combo').innerText = combo;
}

/* ---------- 게임 시작 ---------- */

function startGame(songKey) {
  const selectedSong = songs[songKey];
  if (!selectedSong) return;

  isPlaying = false;
  currentBgm.pause();

  activeSongKey = songKey;
  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  missCount = 0;
  effects = [];

  activeNotes = selectedSong.pattern.map(note => ({
    ...note,
    hit: false,
    missed: false
  }));

  isBgLoaded = false;
  bgImage.onload = () => { isBgLoaded = true; };
  bgImage.onerror = () => { isBgLoaded = false; };
  bgImage.src = selectedSong.bg;

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('song-select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  updateHUD();

  currentBgm.src = selectedSong.src;
  currentBgm.currentTime = 0;
  currentBgm.onended = endGame;

  isPlaying = true;
  lastFrameTime = 0;

  currentBgm.play().catch(error => {
    console.error('Audio playback error:', error);
  });

  requestAnimationFrame(gameLoop);
}

/* ---------- 배경과 레인 ---------- */

function drawBackground() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, width, height);

  if (isBgLoaded && bgImage.complete && bgImage.naturalWidth > 0) {
    ctx.drawImage(bgImage, 0, 0, width, height);

    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, width, height);
  }

  for (let i = 1; i < 4; i++) {
    ctx.strokeStyle = 'rgba(255,105,199,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  ctx.save();
  ctx.shadowColor = '#FF69C7';
  ctx.shadowBlur = 12;
  ctx.strokeStyle = '#FF69C7';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();
  ctx.restore();
}

/* ---------- 노트 ---------- */

function drawNotes(currentTime) {
  activeNotes.forEach(note => {
    if (note.hit || note.missed) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - timeDiff * NOTE_SPEED;
    const noteHeight = 18;

    if (timeDiff < -0.18) {
      note.missed = true;
      combo = 0;
      missCount++;
      updateHUD();

      // MISS에는 별이나 링 이펙트를 만들지 않는다.
      return;
    }

    if (noteY < -20 || noteY > height + 20) return;

    const x = note.lane * laneWidth + 6;
    const w = laneWidth - 12;

    const mainColor =
      (note.lane === 0 || note.lane === 3)
      ? '#FDC7FB'
      : '#45EFFF';

    ctx.save();
    ctx.shadowColor = mainColor;
    ctx.shadowBlur = 15;

    const gradient = ctx.createLinearGradient(
      x, noteY - noteHeight / 2,
      x, noteY + noteHeight / 2
    );

    gradient.addColorStop(0, '#FFFFFF');
    gradient.addColorStop(0.35, mainColor);
    gradient.addColorStop(1, '#FD5DBD');

    ctx.fillStyle = gradient;
    ctx.fillRect(x, noteY - noteHeight / 2, w, noteHeight);

    ctx.restore();
  });
}

/* ---------- 선명한 5각 별 ---------- */

function drawStar(x, y, outerRadius, innerRadius, rotation, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rotation);

  ctx.beginPath();

  for (let i = 0; i < 10; i++) {
    const angle = -Math.PI / 2 + i * Math.PI / 5;
    const radius = i % 2 === 0 ? outerRadius : innerRadius;

    const px = Math.cos(angle) * radius;
    const py = Math.sin(angle) * radius;

    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }

  ctx.closePath();
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 8;
  ctx.fill();

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#FFFFFF';
  ctx.stroke();

  ctx.restore();
}

/* ---------- 성공 판정 이펙트만 생성 ---------- */

function addHitEffect(lane, type) {
  const x = lane * laneWidth + laneWidth / 2;
  const y = judgeLineY;
  const perfect = type === 'PERFECT';

  const colors = perfect
    ? ['#FFFFFF', '#FFB9F4', '#FF69C7', '#7DF9FF']
    : ['#FFFFFF', '#7DF9FF', '#45DFFF', '#FFB9F4'];

  effects.push({
    kind: 'burst',
    x, y,
    age: 0,
    duration: perfect ? 0.62 : 0.45,
    perfect,
    colors
  });

  // 뾰족한 별 파티클
  const count = perfect ? 16 : 10;

  for (let i = 0; i < count; i++) {
    const angle =
      (Math.PI * 2 * i / count) +
      (Math.random() - 0.5) * 0.2;

    const speed =
      (perfect ? 130 : 90) + Math.random() * 100;

    effects.push({
      kind: 'particle',
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      age: 0,
      duration: 0.55 + Math.random() * 0.2,
      size: perfect
        ? 9 + Math.random() * 7
        : 7 + Math.random() * 5,
      rotation: Math.random() * Math.PI,
      spin: (Math.random() - 0.5) * 5,
      color: [
        '#FFFFFF',
        '#FFB9F4',
        '#FF69C7',
        '#7DF9FF'
      ][Math.floor(Math.random() * 4)]
    });
  }

  effects.push({
    kind: 'flash',
    x, y,
    age: 0,
    duration: 0.22,
    color: perfect ? '#FFB9F4' : '#7DF9FF'
  });

  effects.push({
    kind: 'text',
    x,
    y: y - 30,
    text: type,
    age: 0,
    duration: 0.55,
    color: perfect ? '#FFFFFF' : '#7DF9FF'
  });
}

/* ---------- 이펙트 애니메이션 ---------- */

function drawEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const effect = effects[i];
    effect.age += dt;

    const progress = Math.min(
      effect.age / effect.duration, 1
    );

    const alpha = Math.max(0, 1 - progress);

    if (progress >= 1) {
      effects.splice(i, 1);
      continue;
    }

    if (effect.kind === 'burst') {
      drawBurst(effect, progress, alpha);
    } else if (effect.kind === 'particle') {
      drawParticle(effect, dt, alpha);
    } else if (effect.kind === 'flash') {
      drawFlash(effect, progress, alpha);
    } else if (effect.kind === 'text') {
      drawJudgement(effect, progress, alpha);
    }
  }
}

/* 링과 중심 광채 */
function drawBurst(effect, progress, alpha) {
  const { x, y, perfect, colors } = effect;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.globalCompositeOperation = 'lighter';

  const maxRadius = perfect ? 72 : 52;
  const radius = 8 + maxRadius * progress;

  const glowRadius =
    (perfect ? 48 : 32) * (1 - progress * 0.65);

  const glow = ctx.createRadialGradient(
    x, y, 0,
    x, y, glowRadius
  );

  glow.addColorStop(0, 'rgba(255,255,255,0.95)');
  glow.addColorStop(0.25, colors[1]);
  glow.addColorStop(0.6, colors[2]);
  glow.addColorStop(1, 'rgba(255,105,199,0)');

  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
  ctx.fill();

  // 바깥쪽 네온 링
  ctx.strokeStyle = colors[1];
  ctx.lineWidth = perfect
    ? 4 * (1 - progress) + 0.5
    : 3 * (1 - progress) + 0.5;

  ctx.shadowColor = colors[2];
  ctx.shadowBlur = 18;

  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.stroke();

  // 안쪽의 하얀 링
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 1.5 * (1 - progress) + 0.3;
  ctx.shadowBlur = 10;

  ctx.beginPath();
  ctx.arc(x, y, radius * 0.68, 0, Math.PI * 2);
  ctx.stroke();

  // 십자 광선
  const rayLength = (perfect ? 65 : 42) * (1 - progress);

  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 2;
  ctx.shadowColor = colors[1];
  ctx.shadowBlur = 20;

  ctx.beginPath();
  ctx.moveTo(x - rayLength, y);
  ctx.lineTo(x + rayLength, y);
  ctx.moveTo(x, y - rayLength);
  ctx.lineTo(x, y + rayLength);
  ctx.stroke();

  ctx.restore();
}

/* 별 파티클 */
function drawParticle(effect, dt, alpha) {
  effect.x += effect.vx * dt;
  effect.y += effect.vy * dt;

  effect.vx *= Math.pow(0.08, dt);
  effect.vy *= Math.pow(0.08, dt);
  effect.vy += 55 * dt;
  effect.rotation += effect.spin * dt;

  const size = effect.size * (0.5 + alpha * 0.5);

  ctx.save();
  ctx.globalAlpha = alpha;

  drawStar(
    effect.x,
    effect.y,
    size,
    size * 0.32,
    effect.rotation,
    effect.color
  );

  ctx.restore();
}

/* 세로 광선 */
function drawFlash(effect, progress, alpha) {
  const { x, y, color } = effect;

  ctx.save();
  ctx.globalAlpha = alpha * 0.8;
  ctx.globalCompositeOperation = 'lighter';

  const length = 20 + progress * 85;

  const gradient = ctx.createLinearGradient(
    x, y - length,
    x, y + length
  );

  gradient.addColorStop(0, 'rgba(255,255,255,0)');
  gradient.addColorStop(0.45, color);
  gradient.addColorStop(0.5, '#FFFFFF');
  gradient.addColorStop(0.55, color);
  gradient.addColorStop(1, 'rgba(255,255,255,0)');

  ctx.fillStyle = gradient;
  ctx.fillRect(x - 2, y - length, 4, length * 2);

  ctx.restore();
}

/* 판정 텍스트 */
function drawJudgement(effect, progress, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const rise = progress * 28;

  ctx.translate(effect.x, effect.y - rise);
  ctx.scale(0.8 + Math.min(progress * 1.5, 0.2), 0.8 + Math.min(progress * 1.5, 0.2));

  ctx.font = '10px "Press Start 2P"';
  ctx.fillStyle = effect.color;
  ctx.shadowColor = effect.color;
  ctx.shadowBlur = 12;
  ctx.fillText(effect.text, 0, 0);

  ctx.restore();
}

/* ---------- 입력 판정 ---------- */

function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = currentBgm.currentTime;
  let target = null;
  let bestDiff = Infinity;

  for (const note of activeNotes) {
    if (
      note.lane !== lane ||
      note.hit ||
      note.missed
    ) continue;

    const diff = Math.abs(note.time - currentTime);

    if (diff < bestDiff) {
      bestDiff = diff;
      target = note;
    }
  }

  // 판정에 실패하면 어떤 이펙트도 생성하지 않는다.
  if (!target || bestDiff > 0.15) return;

  target.hit = true;

  combo++;
  maxCombo = Math.max(maxCombo, combo);

  const isPerfect = bestDiff <= 0.07;
  const judgement = isPerfect ? 'PERFECT' : 'GREAT';

  if (isPerfect) {
    perfectCount++;
    score += 1000;
  } else {
    greatCount++;
    score += 500;
  }

  // 성공했을 때만 별과 링 생성
  addHitEffect(lane, judgement);

  updateHUD();
}

/* ---------- 게임 루프 ---------- */

function gameLoop(timestamp) {
  if (!isPlaying) return;

  const dt = lastFrameTime
    ? Math.min((timestamp - lastFrameTime) / 1000, 0.04)
    : 0;

  lastFrameTime = timestamp;

  ctx.clearRect(0, 0, width, height);
  drawBackground();

  if (currentBgm.ended) {
    endGame();
    return;
  }

  drawNotes(currentBgm.currentTime);
  drawEffects(dt);

  requestAnimationFrame(gameLoop);
}

/* ---------- 결과 화면 ---------- */

function endGame() {
  if (!isPlaying) return;

  isPlaying = false;
  currentBgm.pause();

  const totalNotes = songs[activeSongKey].pattern.length;
  const maxPossibleScore = totalNotes * 1000;

  const accuracy = maxPossibleScore > 0
    ? score / maxPossibleScore * 100
    : 0;

  let rank = 'F';
  let message = '"STAGE FAILED... TRY AGAIN!"';
  let shadowColor = '#ff4444';

  if (accuracy >= 90) {
    rank = 'S';
    message = '"AMAZING! PERFECT RHYTHM!"';
    shadowColor = '#ffd700';
  } else if (accuracy >= 80) {
    rank = 'A';
    message = '"GREAT JOB!"';
    shadowColor = '#FD5DBD';
  } else if (accuracy >= 70) {
    rank = 'B';
    message = '"GOOD!"';
    shadowColor = '#00fff2';
  } else if (accuracy >= 60) {
    rank = 'C';
    message = '"CLEAR!"';
    shadowColor = '#ff8800';
  }

  const resultScreen = document.getElementById('result-screen');

  resultScreen.innerHTML = `
    <div style="
      font-size:4.5rem;
      color:#fff;
      text-shadow:0 0 15px ${shadowColor};
      margin-bottom:5px;
    ">${rank}</div>

    <div style="
      font-size:.65rem;
      color:#fcd3f2;
      margin-bottom:20px;
    ">${message}</div>

    <div style="
      font-size:.65rem;
      line-height:2.2;
      margin-bottom:25px;
      text-align:left;
    ">
      <p style="color:#00fff2">PERFECT : ${perfectCount}</p>
      <p style="color:#fcd3f2">GREAT : ${greatCount}</p>
      <p style="color:#ff4444">MISS : ${missCount}</p>
      <hr style="border:0;border-top:1px solid #555;margin:5px 0">
      <p style="color:#fff">MAX COMBO : ${maxCombo}</p>
      <p style="color:#ffd700">SCORE : ${score}</p>
    </div>

    <div>
      <button id="retry-btn" class="start-btn">RETRY</button><br>
      <button id="select-song-btn" class="start-btn">SELECT SONG</button>
    </div>
  `;

  resultScreen.classList.remove('hidden');

  document.getElementById('retry-btn').addEventListener(
    'click', () => startGame(activeSongKey)
  );

  document.getElementById('select-song-btn').addEventListener(
    'click', goToSongSelect
  );
}

/* ---------- 버튼 ---------- */

document.getElementById('start-game-btn').addEventListener(
  'click', goToSongSelect
);

document.querySelectorAll('.song-select-btn').forEach(button => {
  button.addEventListener('click', () => {
    startGame(button.getAttribute('data-song'));
  });
});

/* ---------- 키보드 ---------- */

const keyMap = {
  d: 0,
  f: 1,
  j: 2,
  k: 3
};

window.addEventListener('keydown', event => {
  const key = event.key.toLowerCase();

  if (!(key in keyMap)) return;

  event.preventDefault();

  if (isPlaying) {
    triggerInput(keyMap[key]);
  }
});

/* ---------- 터치 ---------- */

canvas.addEventListener('pointerdown', event => {
  if (!isPlaying) return;

  event.preventDefault();

  const rect = canvas.getBoundingClientRect();
  const touchX = event.clientX - rect.left;
  const lane = Math.floor(touchX / laneWidth);

  if (lane >= 0 && lane < 4) {
    triggerInput(lane);
  }
});
</script>
</body>
</html>
