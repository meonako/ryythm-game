<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모바일 4레인 리듬게임</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100%;
      margin: 0 auto;
      background: #1a1a24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 캔버스 */
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* UI 레이어 */
    .screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(15, 15, 25, 0.92);
      z-index: 10;
      padding: 20px;
    }

    .hidden { display: none !important; }

    h1 { font-size: 2rem; color: #00f0ff; margin-bottom: 20px; text-shadow: 0 0 10px #00f0ff; }
    p { margin-bottom: 15px; color: #ccc; font-size: 0.95rem; text-align: center; }

    .btn {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,240,255,0.4);
      margin: 8px;
    }

    /* 상단 HUD */
    #hud {
      position: absolute;
      top: 10px;
      left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 5;
      font-weight: bold;
      font-size: 1.1rem;
      pointer-events: none;
    }

    #score-display { color: #fff; }
    #combo-display { color: #ff007f; font-size: 1.3rem; }

    /* 모바일 터치 패드 */
    #touch-controls {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 18%;
      display: flex;
      z-index: 4;
    }

    .touch-pad {
      flex: 1;
      border-top: 2px solid rgba(255,255,255,0.3);
      border-right: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.5);
    }

    .touch-pad:active, .touch-pad.active {
      background: rgba(0, 240, 255, 0.3);
    }
  </style>
</head>
<body>

<div id="game-container">
  <!-- 게임 플레이 캔버스 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 상단 점수 UI -->
  <div id="hud">
    <div id="score-display">000000</div>
    <div id="combo-display"></div>
  </div>

  <!-- 모바일 터치 영역 -->
  <div id="touch-controls">
    <div class="touch-pad" id="pad-0">D</div>
    <div class="touch-pad" id="pad-1">F</div>
    <div class="touch-pad" id="pad-2">J</div>
    <div class="touch-pad" id="pad-3">K</div>
  </div>

  <!-- 메인 대기 화면 -->
  <div id="start-screen" class="screen">
    <h1>4-LANE RHYTHM</h1>
    <p>모바일 터치 또는 키보드 (D, F, J, K)로 플레이하세요.</p>
    <button class="btn" id="start-btn">GAME START</button>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen" class="screen hidden">
    <h1>CLEAR!</h1>
    <p id="result-score" style="font-size: 1.5rem; color:#fff;"></p>
    <p id="result-combo" style="color:#ff007f;"></p>
    <button class="btn" id="retry-btn">RETRY</button>
  </div>
</div>

<script>
// ==========================================
// 1. 이미지 및 커스텀 경로 설정
// ==========================================
const ASSETS_CONFIG = {
  // 이미지가 없거나 경로가 틀려도 오류가 나지 않게 구성되었습니다.
  bg: './assets/bg.jpg', 
  notes: [
    './assets/note_red.png',   // 레인 0
    './assets/note_blue.png',  // 레인 1
    './assets/note_blue.png',  // 레인 2
    './assets/note_red.png'    // 레인 3
  ]
};

// ==========================================
// 2. 기본 곡 및 노트 배치 데이터 (1초, 2초, 3초...)
// ==========================================
const DEMO_SONG = {
  bpm: 120,
  notes: [
    { time: 1.0, lane: 0 },
    { time: 1.5, lane: 1 },
    { time: 2.0, lane: 2 },
    { time: 2.5, lane: 3 },
    { time: 3.0, lane: 1 },
    { time: 3.0, lane: 2 },
    { time: 3.5, lane: 0 },
    { time: 4.0, lane: 3 },
    { time: 4.5, lane: 1 },
    { time: 5.0, lane: 2 },
    { time: 5.5, lane: 0 },
    { time: 5.5, lane: 3 },
    { time: 6.0, lane: 1 },
    { time: 6.5, lane: 2 },
    { time: 7.0, lane: 0 },
    { time: 7.5, lane: 3 }
  ]
};

// ==========================================
// 3. 게임 변수 설정
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let containerWidth, containerHeight;
let laneWidth, judgmentLineY;
let speed = 600; // 노트 떨어지는 속도 (px/sec)

let audioCtx = null;
let isPlaying = false;
let gameStartTime = 0;
let countdown = 3; // 3초 카운트다운

let score = 0;
let combo = 0;
let maxCombo = 0;
let liveNotes = [];
let effects = [];

// 이미지 로딩 객체
const loadedImages = { bg: null, notes: [] };

function loadAssets() {
  // 배경 이미지 예외 처리 로딩
  const bgImg = new Image();
  bgImg.src = ASSETS_CONFIG.bg;
  bgImg.onload = () => { loadedImages.bg = bgImg; };

  // 노트 이미지 예외 처리 로딩
  ASSETS_CONFIG.notes.forEach((path, idx) => {
    const img = new Image();
    img.src = path;
    img.onload = () => { loadedImages.notes[idx] = img; };
  });
}
loadAssets();

// 캔버스 크기 맞춤
function resizeCanvas() {
  const container = document.getElementById('game-container');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  containerWidth = canvas.width;
  containerHeight = canvas.height;

  laneWidth = containerWidth / 4;
  judgmentLineY = containerHeight * 0.82; // 판정선 위치 (하단 82% 지점)
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ==========================================
// 4. 사운드 효과 (Web Audio API)
// ==========================================
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playBeep(freq = 440, type = 'sine', duration = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ==========================================
// 5. 게임 루프 & 판정 로직
// ==========================================
function startGame() {
  initAudio();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  score = 0;
  combo = 0;
  maxCombo = 0;
  effects = [];
  updateHUD();

  // 노트 데이터 복사
  liveNotes = DEMO_SONG.notes.map(n => ({
    ...n,
    hit: false,
    missed: false
  }));

  isPlaying = true;
  countdown = 3;

  // 카운트다운 타이머
  const countInterval = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      playBeep(600, 'sine', 0.1);
    } else if (countdown === 0) {
      playBeep(1200, 'triangle', 0.2);
      clearInterval(countInterval);
      gameStartTime = performance.now(); // 실제 게임 타임 시작
    }
  }, 1000);

  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score-display').innerText = String(score).padStart(6, '0');
  document.getElementById('combo-display').innerText = combo > 2 ? `${combo} COMBO` : '';
}

function handleInput(laneIndex) {
  if (!isPlaying || countdown > 0) return;

  const currentTime = (performance.now() - gameStartTime) / 1000;
  playBeep(300 + laneIndex * 100, 'square', 0.05);

  // 가장 가까운 미처리 노트 찾기
  const target = liveNotes.find(n => n.lane === laneIndex && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);

    // 판정 범위 (초 단위)
    if (diff <= 0.12) { // PERFECT / GREAT
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      
      const pts = diff <= 0.06 ? 1000 : 700;
      score += pts;
      
      addEffect(laneIndex, diff <= 0.06 ? 'PERFECT' : 'GREAT');
      updateHUD();
    }
  }
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgmentLineY - 20,
    text: text,
    alpha: 1.0
  });
}

// 메인 프레임 그려주기
function gameLoop(timestamp) {
  if (!isPlaying) return;

  ctx.clearRect(0, 0, containerWidth, containerHeight);

  // 1. 배경그리기
  if (loadedImages.bg) {
    ctx.drawImage(loadedImages.bg, 0, 0, containerWidth, containerHeight);
  } else {
    ctx.fillStyle = '#11111d';
    ctx.fillRect(0, 0, containerWidth, containerHeight);
  }

  // 2. 레인 구분선 그리기
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, containerHeight);
    ctx.stroke();
  }

  // 3. 판정선 그리기
  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgmentLineY);
  ctx.lineTo(containerWidth, judgmentLineY);
  ctx.stroke();

  // 4. 카운트다운 처리
  if (countdown > 0) {
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 60px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(countdown, containerWidth / 2, containerHeight / 2);
    requestAnimationFrame(gameLoop);
    return;
  }

  // 경과 시간 계산
  const currentTime = (performance.now() - gameStartTime) / 1000;

  // 5. 노트 위치 계산 및 그리기
  let activeNotesCount = 0;

  liveNotes.forEach(note => {
    if (note.hit) return;

    // 노트 Y 위치 = 판정선 - (노트목표시간 - 현재시간) * 속도
    const timeDiff = note.time - currentTime;
    const noteY = judgmentLineY - (timeDiff * speed);
    const noteHeight = 25;

    // 미스 판정 (판정선을 너무 많이 지나쳤을 때)
    if (timeDiff < -0.2 && !note.missed) {
      note.missed = true;
      combo = 0;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    if (!note.missed) activeNotesCount++;

    // 화면 범위 안의 노트만 그리기
    if (noteY > -50 && noteY < containerHeight + 50 && !note.missed) {
      const noteX = note.lane * laneWidth + 4;
      const noteW = laneWidth - 8;

      if (loadedImages.notes[note.lane]) {
        ctx.drawImage(loadedImages.notes[note.lane], noteX, noteY - noteHeight/2, noteW, noteHeight);
      } else {
        // 이미지가 없을 때 대체 그리기
        ctx.fillStyle = note.lane % 2 === 0 ? '#ff0055' : '#00ccff';
        ctx.beginPath();
        ctx.roundRect(noteX, noteY - noteHeight/2, noteW, noteHeight, 6);
        ctx.fill();
      }
    }
  });

  // 6. 이펙트 텍스트 그리기
  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.fillStyle = eff.text === 'MISS' ? `rgba(255, 0, 0, ${eff.alpha})` : `rgba(0, 240, 255, ${eff.alpha})`;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(eff.text, eff.x, eff.y);

    eff.y -= 1;
    eff.alpha -= 0.03;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  // 7. 게임 종료 검사 (모든 노트가 지나간 후 2초 뒤)
  const lastNoteTime = DEMO_SONG.notes[DEMO_SONG.notes.length - 1].time;
  if (currentTime > lastNoteTime + 2.0) {
    endGame();
    return;
  }

  requestAnimationFrame(gameLoop);
}

function endGame() {
  isPlaying = false;
  document.getElementById('result-score').innerText = `SCORE: ${score}`;
  document.getElementById('result-combo').innerText = `MAX COMBO: ${maxCombo}`;
  document.getElementById('result-screen').classList.remove('hidden');
}

// ==========================================
// 6. 입력 이벤트 처리 (터치 및 키보드)
// ==========================================
const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, '1': 0, '2': 1, '3': 2, '4': 3 };

window.addEventListener('keydown', (e) => {
  const lane = keyMap[e.key.toLowerCase()];
  if (lane !== undefined) {
    const pad = document.getElementById(`pad-${lane}`);
    if (pad) pad.classList.add('active');
    handleInput(lane);
  }
});

window.addEventListener('keyup', (e) => {
  const lane = keyMap[e.key.toLowerCase()];
  if (lane !== undefined) {
    const pad = document.getElementById(`pad-${lane}`);
    if (pad) pad.classList.remove('active');
  }
});

// 터치 패드 이벤트
[0, 1, 2, 3].forEach(lane => {
  const pad = document.getElementById(`pad-${lane}`);
  
  pad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    pad.classList.add('active');
    handleInput(lane);
  });

  pad.addEventListener('touchend', (e) => {
    e.preventDefault();
    pad.classList.remove('active');
  });
});

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
</script>
</body>
</html>
