<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Rhythm Game</title>
  <!-- 레트로 픽셀 폰트 로드 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Press Start 2P', cursive;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 90vh;
      max-height: 700px;
      background-color: #050505;
      border: 4px solid ##FDC7FB;
      box-shadow: 0 0 20px rgba(255, 105, 199, 0.4);
      display: flex;
      flex-direction: column;
    }

    /* 상단 HUD (점수/콤보) */
    #hud {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background-color: #111;
      border-bottom: 2px solid #FF69C7;
      font-size: 0.8rem;
    }

    #score { color: #ffd700; }
    #combo { color: #fcd3f2; }

    /* Canvas 및 오버레이 화면 */
    #canvas-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 10;
    }

    .hidden { display: none !important; }

    h1 {
      color: #fcd3f2;
      font-size: 1.2rem;
      margin-bottom: 15px;
      line-height: 1.5;
      text-shadow: 3px 3px #FF69C7;
    }

   h2 {
  color: #ffffff; /* 흰색으로 변경 */
  font-size: 0.75rem; /* 문구 길이에 맞게 폰트 크기 조정 */
  margin-bottom: 25px;
  text-shadow: none; /* 그림자 제거 */
}

    p {
      font-size: 0.6rem;
      color: #aaa;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .start-btn {
      color: #ffffff; /* 흰색으로 변경 */
  font-size: 2.0rem; /* 문구 길이에 맞게 폰트 크기 조정 */
  margin-bottom: 25px;
  text-shadow: none; /* 그림자 제거 */
}

    .start-btn:active {
      transform: translate(2px, 2px);
      box-shadow: none;

    /* 하단 터치 패드 */
    #touch-pads {
      display: flex;
      height: 70px;
      background-color: #111;
      border-top: 2px solid #FF69C7;
    }

    .pad {
      flex: 1;
      border-right: 1px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.9rem;
      color: #fcd3f2;
    }

    .pad:last-child { border-right: none; }
    .pad.active {
      background-color: #FF69C7;
      color: #000;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div>SCORE: <span id="score">000000</span></div>
    <div><span id="combo">0</span> COMBO</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="gameCanvas"></canvas>

    <!-- 시작 오버레이 -->
    <div id="start-screen" class="screen">
      <h1>ROMANTIC<br>RHYTHM</h1>
      
      <h2>2026  WORK  BY  YUNSEON</h2>
      
      <p>KEYBOARD: D - F - J - K<br>TOUCH: BOTTOM PADS</p>
      <button class="start-btn" id="start-btn">START GAME</button>
    </div>

    <!-- 결과 오버레이 -->
    <div id="result-screen" class="screen hidden"></div>
  </div>

  <!-- 하단 터치 영역 -->
  <div id="touch-pads">
    <div class="pad" id="pad-0"></div>
    <div class="pad" id="pad-1"></div>
    <div class="pad" id="pad-2"></div>
    <div class="pad" id="pad-3"></div>
  </div>
</div>

<script>
// ==========================================
// 1. 핵심 초기화 및 설정
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');

let width, height, laneWidth, judgeLineY;

function resize() {
  width = canvas.width = wrapper.clientWidth;
  height = canvas.height = wrapper.clientHeight;
  laneWidth = width / 4;
  judgeLineY = height - 50;
}
window.addEventListener('resize', resize);
resize();

// 외부 오디오 설정
const bgm = new Audio();
bgm.src = './Gossip.mp3'; // 외부 MP3 파일 경로

// 효과음용 Web Audio API
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSound(freq, type = 'square', duration = 0.08) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ==========================================
// 2. 게임 패턴 및 상태 변수
// ==========================================
const NOTE_SPEED = 350;

// 노트 채보 패턴 (초 단위 위치)
const SONG_PATTERN = [
  { time: 1.2, lane: 0 }, { time: 1.7, lane: 1 }, { time: 2.2, lane: 2 }, { time: 2.7, lane: 3 },
  { time: 3.2, lane: 1 }, { time: 3.2, lane: 2 }, { time: 3.8, lane: 0 }, { time: 4.3, lane: 3 },
  { time: 5.0, lane: 0 }, { time: 5.4, lane: 1 }, { time: 5.8, lane: 2 }, { time: 6.2, lane: 3 },
  { time: 7.0, lane: 0 }, { time: 7.0, lane: 3 }, { time: 7.5, lane: 1 }, { time: 8.0, lane: 2 },
  { time: 8.5, lane: 0 }, { time: 8.8, lane: 1 }, { time: 9.1, lane: 2 }, { time: 9.4, lane: 3 },
  { time: 10.0, lane: 0 }, { time: 10.25, lane: 1 }, { time: 10.5, lane: 2 }, { time: 10.75, lane: 3 },
  { time: 11.2, lane: 1 }, { time: 11.5, lane: 2 }, { time: 12.0, lane: 0 }, { time: 12.4, lane: 3 }
];

let isPlaying = false;
let startTime = 0;
let score = 0;
let combo = 0;
let maxCombo = 0;
let perfectCount = 0;
let greatCount = 0;
let missCount = 0;

let activeNotes = [];
let effects = [];

// ==========================================
// 3. 게임 시작 및 음원 연동
// ==========================================
function startGame() {
  initAudio();
  
  score = 0;
  combo = 0;
  maxCombo = 0;
  perfectCount = 0;
  greatCount = 0;
  missCount = 0;
  effects = [];
  
  activeNotes = SONG_PATTERN.map(n => ({ ...n, hit: false, missed: false }));
  
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  updateHUD();

  // 음원 재생 및 음악 종료 시 게임 종료 처리
  bgm.currentTime = 0;
  const playPromise = bgm.play();
  if (playPromise !== undefined) {
    playPromise.catch(err => {
      console.warn("오디오 재생 실패 (파일 없음 또는 재생 제한):", err);
    });
  }

  // ★ 음악이 끝나면 자동으로 게임 종료 실행
  bgm.onended = () => {
    endGame();
  };

  isPlaying = true;
  startTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score').innerText = String(score).padStart(6, '0');
  document.getElementById('combo').innerText = combo;
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgeLineY - 15,
    text: text,
    alpha: 1.0
  });
}

// 렌더링 프레임
function gameLoop(timestamp) {
  if (!isPlaying) return;

  const currentTime = (timestamp - startTime) / 1000;

  // 1. 화면 소거
  ctx.fillStyle = '#050505';
  ctx.fillRect(0, 0, width, height);

  // 2. 레인 구분선 그리기
  ctx.strokeStyle = '#220022';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, height);
    ctx.stroke();
  }

  // 3. 판정선 그리기
  ctx.strokeStyle = '#FF69C7';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgeLineY);
  ctx.lineTo(width, judgeLineY);
  ctx.stroke();

  // 4. 노트 처리 및 그리기 (부드러운 네온 그라데이션)
  activeNotes.forEach(note => {
    if (note.hit) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgeLineY - (timeDiff * NOTE_SPEED);
    const noteHeight = 18;

    // 미스 판정
    if (timeDiff < -0.18 && !note.missed) {
      note.missed = true;
      combo = 0;
      missCount++;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    // 노트 그래픽 출력
    if (noteY > -20 && noteY < height + 20 && !note.missed) {
      const x = note.lane * laneWidth + 6;
      const w = laneWidth - 12;
      const mainColor = (note.lane === 0 || note.lane === 3) ? '#FF69C7' : '#ffd700';

      ctx.save();

      // 글로우(발광) 효과
      ctx.shadowColor = mainColor;
      ctx.shadowBlur = 15;

      // 그라데이션 만들기
      const gradient = ctx.createLinearGradient(x, noteY - noteHeight / 2, x, noteY + noteHeight / 2);
      gradient.addColorStop(0, '#ffffff');
      gradient.addColorStop(0.3, mainColor);
      gradient.addColorStop(1, '#111111');

      ctx.fillStyle = gradient;

      // 노트 모서리 처리
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, noteY - noteHeight / 2, w, noteHeight, 4);
      } else {
        ctx.fillRect(x, noteY - noteHeight / 2, w, noteHeight);
      }
      ctx.fill();

      // 코어 중앙 하이라이트
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.fillRect(x + 4, noteY - 2, w - 8, 3);

      ctx.restore();
    }
  });

  // 5. 판정 텍스트 연출
  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.fillStyle = eff.text === 'MISS' ? `rgba(255, 0, 0, ${eff.alpha})` : `rgba(255, 215, 0, ${eff.alpha})`;
    ctx.font = '12px "Press Start 2P"';
    ctx.textAlign = 'center';
    ctx.fillText(eff.text, eff.x, eff.y);

    eff.y -= 1;
    eff.alpha -= 0.04;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  requestAnimationFrame(gameLoop);
}

// ==========================================
// 4. 입력 판정
// ==========================================
function triggerInput(lane) {
  if (!isPlaying) return;

  const currentTime = (performance.now() - startTime) / 1000;
  playSound(300 + lane * 100, 'square', 0.05);

  const target = activeNotes.find(n => n.lane === lane && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);
    
    if (diff <= 0.15) {
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      
      const isPerfect = diff <= 0.07;
      if (isPerfect) {
        perfectCount++;
        score += 1000;
      } else {
        greatCount++;
        score += 500;
      }
      
      addEffect(lane, isPerfect ? 'PERFECT' : 'GREAT');
      playSound(isPerfect ? 800 : 600, 'triangle', 0.1);
      updateHUD();
    }
  }
}

// ==========================================
// 5. 게임 종료 및 랭크 산출 (음악 종료 시 호출)
// ==========================================
function endGame() {
  if (!isPlaying) return;
  isPlaying = false;
  try { bgm.pause(); } catch(e) {}

  const totalNotes = SONG_PATTERN.length;

  let rank = 'F';
  let message = 'KEEP TRYING!';
  let rankColor = '#ff4444'; // 기본 빨간색 네온

  // 랭크 조건 산출
  if (perfectCount === totalNotes) {
    rank = 'S';
    message = 'ALL PERFECT!! PERFECT GAME!';
    rankColor = '#ffd700'; // 금색 네온
  } else if (missCount === 0) {
    rank = 'S';
    message = 'GREAT JOB! NO MISS!';
    rankColor = '#ffd700';
  } else if (missCount <= 3) {
    rank = 'A';
    message = 'EXCELLENT PERFORMANCE!';
    rankColor = '#fcd3f2'; // 분홍 네온
  } else if (missCount <= 7) {
    rank = 'B';
    message = 'NICE CLEAR!';
    rankColor = '#00ffff'; // 민트 네온
  } else {
    rank = 'F';
    message = 'STAGE FAILED... TRY AGAIN!';
    rankColor = '#ff4444'; // 빨간 네온
  }

  // 결과 오버레이 렌더링 (RANK 단독 네온 + RETRY 네온버튼 적용)
  const resultScreen = document.getElementById('result-screen');
  resultScreen.innerHTML = `
    <!-- 심플 랭크 글자 단독 네온 연출 -->
    <div style="
      color: #ffffff; 
      font-size: 4.5rem; 
      margin-bottom: 10px; 
      font-family: 'Press Start 2P', cursive;
      text-shadow: 
        0 0 7px #ffffff,
        0 0 15px ${rankColor},
        0 0 30px ${rankColor},
        0 0 50px ${rankColor};
      line-height: 1;
    ">
      ${rank}
    </div>

    <p style="color: #ffffff; font-size: 0.55rem; margin-bottom: 25px;">"${message}"</p>
    
    <!-- 카운트 결과 영역 (SCORE 제거됨) -->
    <div style="
      font-size: 0.65rem; 
      line-height: 2.2; 
      margin-bottom: 30px; 
      text-align: left; 
      display: inline-block;
    ">
      <p style="color:#ffd700;">PERFECT : ${perfectCount}</p>
      <p style="color:#fcd3f2;">GREAT   : ${greatCount}</p>
      <p style="color:#ff4444;">MISS    : ${missCount}</p>
      <p style="color:#ffffff; border-top: 1px solid #444; margin-top: 8px; padding-top: 8px;">MAX COMBO : ${maxCombo}</p>
    </div>

    <!-- 네온 스타일 RETRY 버튼 -->
    <div>
      <button class="start-btn" id="retry-btn" style="
        background-color: transparent;
        color: ${rankColor};
        border: 2px solid ${rankColor};
        box-shadow: 0 0 10px ${rankColor}, inset 0 0 10px ${rankColor};
        text-shadow: 0 0 5px ${rankColor};
        padding: 12px 28px;
        font-weight: bold;
      ">RETRY</button>
    </div>
  `;

  document.getElementById('retry-btn').addEventListener('click', startGame);
  resultScreen.classList.remove('hidden');
}
// ==========================================
// 6. 이벤트 바인딩
// ==========================================
const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, 'D': 0, 'F': 1, 'J': 2, 'K': 3 };

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const lane = keyMap[e.key];
  if (lane !== undefined) {
    document.getElementById(`pad-${lane}`)?.classList.add('active');
    triggerInput(lane);
  }
});

window.addEventListener('keyup', (e) => {
  const lane = keyMap[e.key];
  if (lane !== undefined) {
    document.getElementById(`pad-${lane}`)?.classList.remove('active');
  }
});

[0, 1, 2, 3].forEach(lane => {
  const pad = document.getElementById(`pad-${lane}`);
  
  const handleTouchStart = (e) => {
    e.preventDefault();
    pad.classList.add('active');
    triggerInput(lane);
  };
  
  const handleTouchEnd = (e) => {
    e.preventDefault();
    pad.classList.remove('active');
  };

  pad.addEventListener('touchstart', handleTouchStart);
  pad.addEventListener('touchend', handleTouchEnd);
  pad.addEventListener('mousedown', handleTouchStart);
  pad.addEventListener('mouseup', handleTouchEnd);
});

document.getElementById('start-btn').addEventListener('click', startGame);
</script>

</body>
</html>
