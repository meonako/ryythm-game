<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>My Rhythm Game</title>


<style>

/* =========================
   기본 설정
========================= */

* {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}


body {

    margin: 0;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: #111;

    color: white;

    font-family: Arial, sans-serif;
}


/* =========================
   게임 화면
========================= */

#game {

    width: 100vw;
    height: 100vh;

    position: relative;

    display: flex;

    justify-content: center;
}


/* =========================
   점수
========================= */

#info {

    position: absolute;

    top: 20px;

    left: 0;

    width: 100%;

    text-align: center;

    z-index: 20;
}


#score {

    font-size: 24px;

    font-weight: bold;
}


#combo {

    margin-top: 5px;

    font-size: 18px;
}


/* =========================
   4레인 전체
========================= */

#laneContainer {

    position: absolute;

    top: 90px;

    bottom: 120px;

    width: min(95vw, 500px);

    display: flex;

    overflow: hidden;

    border-left: 1px solid #555;

    border-right: 1px solid #555;
}


/* =========================
   각각의 레인
========================= */

.lane {

    position: relative;

    width: 25%;

    height: 100%;

    border-right: 1px solid #444;

    background: #181818;
}


/* 마지막 레인은 오른쪽 선 제거 */

.lane:last-child {

    border-right: none;
}


/* 레인 번갈아 색 */

.lane:nth-child(even) {

    background: #202020;
}


/* =========================
   노트
========================= */

.note {

    position: absolute;

    width: 80%;

    height: 24px;

    left: 10%;

    top: -30px;

    border-radius: 12px;

    background: #00eaff;

    box-shadow: 0 0 15px #00eaff;
}


/* =========================
   판정선
========================= */

#judgeLine {

    position: absolute;

    bottom: 70px;

    left: 0;

    width: 100%;

    height: 5px;

    background: white;

    box-shadow: 0 0 10px white;

    z-index: 10;
}


/* =========================
   터치 버튼
========================= */

#buttons {

    position: absolute;

    bottom: 20px;

    width: min(95vw, 500px);

    height: 60px;

    display: flex;

    gap: 4px;

    z-index: 30;
}


.key {

    width: 25%;

    border: none;

    border-radius: 8px;

    background: #333;

    color: white;

    font-size: 18px;

    font-weight: bold;

    touch-action: manipulation;
}


.key:active {

    background: #666;

    transform: scale(0.95);
}


/* =========================
   판정 표시
========================= */

#judgement {

    position: absolute;

    top: 42%;

    left: 0;

    width: 100%;

    text-align: center;

    font-size: 32px;

    font-weight: bold;

    z-index: 40;

}


/* =========================
   시작 화면
========================= */

#startScreen {

    position: absolute;

    width: 100%;

    height: 100%;

    background: #111;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;
}


#startScreen h1 {

    font-size: 30px;

    margin-bottom: 10px;
}


#startScreen p {

    color: #aaa;

    margin-bottom: 30px;
}


#startButton {

    padding: 15px 50px;

    border: none;

    border-radius: 10px;

    background: #00eaff;

    color: #111;

    font-size: 20px;

    font-weight: bold;
}

</style>

</head>


<body>


<div id="game">


<!-- =========================
     시작 화면
========================= -->

<div id="startScreen">

    <h1>RHYTHM GAME</h1>

    <p>노트가 판정선에 도착하면 눌러주세요</p>

    <button id="startButton">
        START
    </button>

</div>


<!-- =========================
     점수
========================= -->

<div id="info">

    <div id="score">
        SCORE: 0
    </div>

    <div id="combo">
        COMBO: 0
    </div>

</div>


<!-- 판정 결과 -->

<div id="judgement"></div>


<!-- =========================
     4개의 레인
========================= -->

<div id="laneContainer">

    <div class="lane" id="lane0"></div>

    <div class="lane" id="lane1"></div>

    <div class="lane" id="lane2"></div>

    <div class="lane" id="lane3"></div>

    <div id="judgeLine"></div>

</div>


<!-- =========================
     모바일 버튼
========================= -->

<div id="buttons">

    <button class="key" data-lane="0">
        1
    </button>

    <button class="key" data-lane="1">
        2
    </button>

    <button class="key" data-lane="2">
        3
    </button>

    <button class="key" data-lane="3">
        4
    </button>

</div>


</div>


<script>


/* =========================
   게임 변수
========================= */

let score = 0;

let combo = 0;

let playing = false;


/* 현재 존재하는 노트 */

let notes = [];


/* 노트 번호 */

let noteId = 0;


/* 노트 속도 */

const noteSpeed = 4;


/* 노트가 생성되는 간격 */

const noteInterval = 800;


/* =========================
   HTML 가져오기
========================= */

const scoreText =
document.getElementById("score");

const comboText =
document.getElementById("combo");

const judgement =
document.getElementById("judgement");

const startButton =
document.getElementById("startButton");

const startScreen =
document.getElementById("startScreen");


/* =========================
   게임 시작
========================= */

startButton.addEventListener(
    "click",
    startGame
);


function startGame() {

    score = 0;

    combo = 0;

    notes = [];

    playing = true;

    scoreText.textContent =
        "SCORE: 0";

    comboText.textContent =
        "COMBO: 0";

    startScreen.style.display =
        "none";


    /* 첫 노트 */

    createNote();


    /* 일정한 간격으로 노트 생성 */

    setInterval(
        function() {

            if (playing) {

                createNote();

            }

        },
        noteInterval
    );


    requestAnimationFrame(gameLoop);

}


/* =========================
   노트 생성
========================= */

function createNote() {


    /* 0~3 중 랜덤 */

    const laneNumber =
        Math.floor(Math.random() * 4);


    /* 레인 찾기 */

    const lane =
        document.getElementById(
            "lane" + laneNumber
        );


    /* 노트 만들기 */

    const note =
        document.createElement("div");


    note.classList.add("note");


    /* 노트 위치 */

    note.style.top =
        "-30px";


    /* 레인에 넣기 */

    lane.appendChild(note);


    /* 노트 정보 저장 */

    notes.push({

        id: noteId++,

        lane: laneNumber,

        y: -30,

        element: note

    });

}


/* =========================
   게임 루프
========================= */

function gameLoop() {


    if (!playing) {

        return;

    }


    /* 모든 노트 이동 */

    notes.forEach(
        function(note) {


            note.y += noteSpeed;


            note.element.style.top =
                note.y + "px";


        }
    );


    /* 화면 밖 노트 제거 */

    for (
        let i = notes.length - 1;
        i >= 0;
        i--
    ) {


        if (notes[i].y > 700) {


            notes[i].element.remove();


            notes.splice(i, 1);


            combo = 0;


            comboText.textContent =
                "COMBO: 0";


            showJudgement("MISS");

        }

    }


    requestAnimationFrame(gameLoop);

}


/* =========================
   레인 누르기
========================= */

function hitLane(laneNumber) {


    if (!playing) {

        return;

    }


    /* 해당 레인의 노트만 찾기 */

    let target = null;


    for (
        let i = 0;
        i < notes.length;
        i++
    ) {


        if (
            notes[i].lane === laneNumber
        ) {

            target = notes[i];

            break;

        }

    }


    /* 해당 레인에 노트가 없음 */

    if (!target) {

        return;

    }


    /* 판정선 위치 */

    const targetY = 420;


    /* 노트와 판정선 거리 */

    const distance =
        Math.abs(
            target.y - targetY
        );


    /* PERFECT */

    if (distance < 25) {


        score += 100;

        combo++;


        showJudgement(
            "PERFECT!"
        );


        removeNote(target);

    }


    /* GOOD */

    else if (distance < 60) {


        score += 50;

        combo++;


        showJudgement(
            "GOOD"
        );


        removeNote(target);

    }


    /* MISS */

    else {


        combo = 0;


        showJudgement(
            "MISS"
        );

    }


    scoreText.textContent =
        "SCORE: " + score;


    comboText.textContent =
        "COMBO: " + combo;

}


/* =========================
   노트 제거
========================= */

function removeNote(note) {


    note.element.remove();


    const index =
        notes.indexOf(note);


    if (index !== -1) {

        notes.splice(
            index,
            1
        );

    }

}


/* =========================
   판정 표시
========================= */

function showJudgement(text) {


    judgement.textContent =
        text;


    setTimeout(
        function() {

            judgement.textContent =
                "";

        },
        400
    );

}


/* =========================
   모바일 버튼
========================= */

const buttons =
document.querySelectorAll(".key");


buttons.forEach(
    function(button) {


        button.addEventListener(
            "click",
            function() {


                const lane =
                    Number(
                        button.dataset.lane
                    );


                hitLane(lane);

            }
        );

    }
);


/* =========================
   PC 키보드
========================= */

document.addEventListener(
    "keydown",
    function(event) {


        if (
            event.code === "KeyA"
        ) {

            hitLane(0);

        }


        if (
            event.code === "KeyS"
        ) {

            hitLane(1);

        }


        if (
            event.code === "KeyD"
        ) {

            hitLane(2);

        }


        if (
            event.code === "KeyF"
        ) {

            hitLane(3);

        }

    }
);

</script>

</body>

</html>
