<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모바일 4레인 리듬게임</title>
  
  <!-- Google Fonts 공식 CDN으로 변경 (DungGeunMo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DungGeunMo&display=swap" rel="stylesheet">

    /* 폰트 정의 및 적용 */
    @font-family {
      font-family: 'DungGeunMo';
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffe3e8;
      /* 둥근모 폰트 적용 + 대체 폰트 지정 */
      font-family: 'DungGeunMo', 'Galmuri11', 'Courier New', monospace, sans-serif !important;
      color: #4a4a4a;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100%;
      margin: 0 auto;
      background: linear-gradient(180deg, #fff5f7 0%, #ffe3e8 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
      font-family: 'DungGeunMo', monospace, sans-serif;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(255, 245, 247, 0.94);
      z-index: 10;
      padding: 20px;
      font-family: 'DungGeunMo', monospace, sans-serif;
    }

    .hidden { display: none !important; }

    /* 베이비 핑크 타이틀 */
    h1 { 
      font-family: 'DungGeunMo', monospace, sans-serif;
      font-size: 2.2rem; 
      color: #ff8fa3; 
      margin-bottom: 15px; 
      text-shadow: 0 0 10px rgba(255, 143, 163, 0.4); 
      letter-spacing: 1px;
    }

    p { 
      font-family: 'DungGeunMo', monospace, sans-serif;
      margin-bottom: 15px; 
      color: #666; 
      font-size: 1rem; 
      text-align: center; 
    }

    /* 베이비 핑크 버튼 스타일 */
    .btn {
      background: linear-gradient(135deg, #ffb6c1, #ff8fa3);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 1.2rem;
      font-family: 'DungGeunMo', monospace, sans-serif;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 143, 163, 0.4);
      margin: 10px;
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .song-list {
      width: 100%;
      max-height: 60%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 15px 0;
      padding: 5px;
    }

    .song-card {
      background: rgba(255, 255, 255, 0.85);
      border: 2px solid #ffccd5;
      border-radius: 16px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(255, 182, 193, 0.2);
      font-family: 'DungGeunMo', monospace, sans-serif;
    }

    .song-card:active {
      background: #ffe3e8;
      border-color: #ff8fa3;
      transform: scale(0.98);
    }

    .song-info {
      text-align: left;
    }

    .song-title {
      font-family: 'DungGeunMo', monospace, sans-serif;
      font-size: 1.2rem;
      color: #4a4a4a;
    }

    .song-artist {
      font-family: 'DungGeunMo', monospace, sans-serif;
      font-size: 0.9rem;
      color: #888;
      margin-top: 4px;
    }

    .song-play-btn {
      font-family: 'DungGeunMo', monospace, sans-serif;
      background: #ff8fa3;
      color: #fff;
      padding: 8px 16px;
      border-radius: 15px;
      font-size: 0.95rem;
      box-shadow: 0 2px 6px rgba(255, 143, 163, 0.4);
    }

    #hud {
      position: absolute;
      top: 15px;
      left: 15px; right: 15px;
      display: flex;
      justify-content: space-between;
      z-index: 5;
      font-size: 1.2rem;
      pointer-events: none;
      font-family: 'DungGeunMo', monospace, sans-serif;
    }

    #score-display { 
      color: #555; 
      font-family: 'DungGeunMo', monospace, sans-serif;
    }
    
    #combo-display { 
      color: #ff8fa3; 
      font-size: 1.4rem; 
      text-shadow: 0 0 6px rgba(255, 143, 163, 0.3); 
      font-family: 'DungGeunMo', monospace, sans-serif;
    }

    #touch-controls {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 18%;
      display: flex;
      z-index: 4;
    }

    .touch-pad {
      flex: 1;
      border-top: 2px solid rgba(255, 182, 193, 0.5);
      border-right: 1px solid rgba(255, 182, 193, 0.3);
      background: rgba(255, 255, 255, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      color: #888;
      font-family: 'DungGeunMo', monospace, sans-serif;
    }

    .touch-pad:active, .touch-pad.active {
      background: rgba(255, 182, 193, 0.5);
      color: #ff4d6d;
    }
  </style>
</head>
<body>

// ==========================================
// 3. 변수 및 시스템 설정
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let containerWidth, containerHeight;
let laneWidth, judgmentLineY;
let speed = 600;

let audioCtx = null;
let bgmAudio = new Audio();
let currentSong = null;
let isPlaying = false;
let gameStartTime = 0;
let countdown = 3;

let score = 0;
let combo = 0;
let maxCombo = 0;
let liveNotes = [];
let effects = [];

const loadedImages = { bg: null, notes: [] };

function loadImages() {
  const bgImg = new Image();
  bgImg.src = IMAGE_ASSETS.bg;
  bgImg.onload = () => { loadedImages.bg = bgImg; };

  IMAGE_ASSETS.notes.forEach((path, idx) => {
    const img = new Image();
    img.src = path;
    img.onload = () => { loadedImages.notes[idx] = img; };
  });
}
loadImages();

function resizeCanvas() {
  const container = document.getElementById('game-container');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  containerWidth = canvas.width;
  containerHeight = canvas.height;
  laneWidth = containerWidth / 4;
  judgmentLineY = containerHeight * 0.82;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playBeep(freq = 440, type = 'sine', duration = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ==========================================
// 4. 곡 선택 UI
// ==========================================
function renderSongList() {
  const container = document.getElementById('song-list-container');
  container.innerHTML = '';

  SONGS.forEach(song => {
    const card = document.createElement('div');
    card.className = 'song-card';
    card.innerHTML = `
      <div class="song-info">
        <div class="song-title">${song.title}</div>
        <div class="song-artist">${song.artist}</div>
      </div>
      <div class="song-play-btn">PLAY</div>
    `;
    card.addEventListener('click', () => {
      selectAndStartGame(song);
    });
    container.appendChild(card);
  });
}

function showSelectScreen() {
  initAudio();
  renderSongList();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('select-screen').classList.remove('hidden');
}

// ==========================================
// 5. 게임 시작 및 메인 루프
// ==========================================
function selectAndStartGame(song) {
  initAudio();
  currentSong = song;

  bgmAudio.pause();
  if (song.audioPath) {
    bgmAudio.src = song.audioPath;
    bgmAudio.load();
  } else {
    bgmAudio.src = '';
  }

  bgmAudio.onended = () => {
    endGame();
  };

  document.getElementById('select-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  score = 0;
  combo = 0;
  maxCombo = 0;
  effects = [];
  updateHUD();

  liveNotes = currentSong.notes.map(n => ({
    ...n,
    hit: false,
    missed: false
  }));

  isPlaying = true;
  countdown = 3;

  const countInterval = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      playBeep(600, 'sine', 0.1);
    } else if (countdown === 0) {
      playBeep(1200, 'triangle', 0.2);
      clearInterval(countInterval);
      
      if (currentSong.audioPath) {
        bgmAudio.currentTime = 0;
        const playPromise = bgmAudio.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.warn("오디오 재생 오류:", error);
          });
        }
      }
      gameStartTime = performance.now();
    }
  }, 1000);

  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score-display').innerText = String(score).padStart(6, '0');
  document.getElementById('combo-display').innerText = combo > 2 ? `${combo} COMBO` : '';
}

function handleInput(laneIndex) {
  if (!isPlaying || countdown > 0) return;

  const currentTime = (performance.now() - gameStartTime) / 1000;
  playBeep(300 + laneIndex * 100, 'square', 0.05);

  const target = liveNotes.find(n => n.lane === laneIndex && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);
    if (diff <= 0.12) {
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const pts = diff <= 0.06 ? 1000 : 700;
      score += pts;
      addEffect(laneIndex, diff <= 0.06 ? 'PERFECT' : 'GREAT');
      updateHUD();
    }
  }
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgmentLineY - 20,
    text: text,
    alpha: 1.0
  });
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  ctx.clearRect(0, 0, containerWidth, containerHeight);

  // 배경 렌더링
  if (loadedImages.bg) {
    ctx.drawImage(loadedImages.bg, 0, 0, containerWidth, containerHeight);
  } else {
    ctx.fillStyle = '#fff0f3';
    ctx.fillRect(0, 0, containerWidth, containerHeight);
  }

  // 레인 구분을 위한 가이드 라인
  ctx.strokeStyle = 'rgba(255, 182, 193, 0.4)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, containerHeight);
    ctx.stroke();
  }

  // 판정선
  ctx.strokeStyle = '#ff8fa3';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgmentLineY);
  ctx.lineTo(containerWidth, judgmentLineY);
  ctx.stroke();

  // 캔버스 내 DungGeunMo 폰트 명시적 지정
  const fontStyle = 'DungGeunMo, monospace, sans-serif';

  // 카운트다운
  if (countdown > 0) {
    ctx.fillStyle = '#ff8fa3';
    ctx.font = `bold 65px ${fontStyle}`;
    ctx.textAlign = 'center';
    ctx.fillText(countdown, containerWidth / 2, containerHeight / 2);
    requestAnimationFrame(gameLoop);
    return;
  }

  const currentTime = (performance.now() - gameStartTime) / 1000;

  // 노트 그리기
  liveNotes.forEach(note => {
    if (note.hit) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgmentLineY - (timeDiff * speed);
    const noteHeight = 25;

    if (timeDiff < -0.2 && !note.missed) {
      note.missed = true;
      combo = 0;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    if (noteY > -50 && noteY < containerHeight + 50 && !note.missed) {
      const noteX = note.lane * laneWidth + 4;
      const noteW = laneWidth - 8;

      if (loadedImages.notes[note.lane]) {
        ctx.drawImage(loadedImages.notes[note.lane], noteX, noteY - noteHeight/2, noteW, noteHeight);
      } else {
        ctx.fillStyle = note.lane % 2 === 0 ? '#ff8fa3' : '#ffccd5';
        ctx.beginPath();
        ctx.roundRect(noteX, noteY - noteHeight/2, noteW, noteHeight, 6);
        ctx.fill();
      }
    }
  });

  // 판정 텍스트 렌더링
  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.fillStyle = eff.text === 'MISS' ? `rgba(255, 99, 132, ${eff.alpha})` : `rgba(255, 143, 163, ${eff.alpha})`;
    ctx.font = `bold 24px ${fontStyle}`;
    ctx.textAlign = 'center';
    ctx.fillText(eff.text, eff.x, eff.y);

    eff.y -= 1;
    eff.alpha -= 0.03;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  const lastNoteTime = currentSong.notes[currentSong.notes.length - 1].time;
  if (currentTime > lastNoteTime + 3.0) {
    endGame();
    return;
  }

  requestAnimationFrame(gameLoop);
}

function endGame() {
  isPlaying = false;
  try {
    bgmAudio.pause();
  } catch(e) {}
  document.getElementById('result-score').innerText = `SCORE: ${score}`;
  document.getElementById('result-combo').innerText = `MAX COMBO: ${maxCombo}`;
  document.getElementById('result-screen').classList.remove('hidden');
}

// ==========================================
// 6. 키보드 & 터치 입력 이벤트
// ==========================================
const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, '1': 0, '2': 1, '3': 2, '4': 3 };

window.addEventListener('keydown', (e) => {
  const lane = keyMap[e.key.toLowerCase()];
  if (lane !== undefined) {
    const pad = document.getElementById(`pad-${lane}`);
    if (pad) pad.classList.add('active');
    handleInput(lane);
  }
});

window.addEventListener('keyup', (e) => {
  const lane = keyMap[e.key.toLowerCase()];
  if (lane !== undefined) {
    const pad = document.getElementById(`pad-${lane}`);
    if (pad) pad.classList.remove('active');
  }
});

[0, 1, 2, 3].forEach(lane => {
  const pad = document.getElementById(`pad-${lane}`);
  pad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    pad.classList.add('active');
    handleInput(lane);
  });
  pad.addEventListener('touchend', (e) => {
    e.preventDefault();
    pad.classList.remove('active');
  });
});

// 버튼 연결
document.getElementById('start-btn').addEventListener('click', showSelectScreen);
document.getElementById('retry-btn').addEventListener('click', () => {
  if (currentSong) selectAndStartGame(currentSong);
});
document.getElementById('select-menu-btn').addEventListener('click', showSelectScreen);
</script>
