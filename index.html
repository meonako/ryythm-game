<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>모바일 4레인 리듬게임</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #111;
      font-family: 'Apple SD Gothic Neo', sans-serif;
      color: #fff;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100%;
      margin: 0 auto;
      background: #1a1a24;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(15, 15, 25, 0.92);
      z-index: 10;
      padding: 20px;
    }

    .hidden { display: none !important; }

    h1 { font-size: 2rem; color: #00f0ff; margin-bottom: 20px; text-shadow: 0 0 10px #00f0ff; }
    p { margin-bottom: 15px; color: #ccc; font-size: 0.95rem; text-align: center; }

    .btn {
      background: linear-gradient(135deg, #00f0ff, #7000ff);
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0,240,255,0.4);
      margin: 8px;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px; right: 10px;
      display: flex;
      justify-content: space-between;
      z-index: 5;
      font-weight: bold;
      font-size: 1.1rem;
      pointer-events: none;
    }

    #score-display { color: #fff; }
    #combo-display { color: #ff007f; font-size: 1.3rem; }

    #touch-controls {
      position: absolute;
      bottom: 0; left: 0; width: 100%; height: 18%;
      display: flex;
      z-index: 4;
    }

    .touch-pad {
      flex: 1;
      border-top: 2px solid rgba(255,255,255,0.3);
      border-right: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      color: rgba(255,255,255,0.5);
    }

    .touch-pad:active, .touch-pad.active {
      background: rgba(0, 240, 255, 0.3);
    }

    #start-btn:active {
      transform: scale(0.95);
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="score-display">000000</div>
    <div id="combo-display"></div>
  </div>

  <div id="touch-controls">
    <div class="touch-pad" id="pad-0">D</div>
    <div class="touch-pad" id="pad-1">F</div>
    <div class="touch-pad" id="pad-2">J</div>
    <div class="touch-pad" id="pad-3">K</div>
  </div>

  <!-- 메인 대기 화면 -->
  <div id="start-screen" class="screen">
    <h1>4-LANE RHYTHM</h1>
    <p>모바일 터치 또는 키보드 (D, F, J, K)로 플레이하세요.</p>
    
    <img src="./images/start_btn.png" id="start-btn" alt="GAME START" 
         onerror="this.style.display='none'; document.getElementById('start-btn-fallback').style.display='block';"
         style="width: 200px; cursor: pointer; display: block; margin: 15px auto; transition: transform 0.1s;">
    
    <button class="btn" id="start-btn-fallback" style="display: none;">GAME START</button>
  </div>

  <!-- 결과 화면 -->
  <div id="result-screen" class="screen hidden">
    <h1>CLEAR!</h1>
    <p id="result-score" style="font-size: 1.5rem; color:#fff;"></p>
    <p id="result-combo" style="color:#ff007f;"></p>
    <button class="btn" id="retry-btn">RETRY</button>
  </div>
</div>

<script>
// ==========================================
// 1. 에셋 경로 설정 (최상위 파일 경로로 복원)
// ==========================================
const ASSETS_CONFIG = {
  bg: './images/bg.jpg', 
  audio: './Gossip.mp3', // 최상위에 배치된 mp3 경로
  notes: [
    './assets/note_red.png',
    './assets/note_blue.png',
    './assets/note_blue.png',
    './assets/note_red.png'
  ]
};

// ==========================================
// 2. 82MAJOR - Gossip (1분 33초 맞춤 채보 데이터)
// ==========================================
const DEMO_SONG = {
  bpm: 125,
  notes: [
    // [0 ~ 10초: Intro]
    { time: 2.0, lane: 0 }, { time: 2.5, lane: 1 }, { time: 3.0, lane: 2 }, { time: 3.5, lane: 3 },
    { time: 4.0, lane: 1 }, { time: 4.0, lane: 2 }, { time: 4.5, lane: 0 }, { time: 5.0, lane: 3 },
    { time: 6.0, lane: 0 }, { time: 6.5, lane: 1 }, { time: 7.0, lane: 2 }, { time: 7.5, lane: 3 },
    { time: 8.0, lane: 0 }, { time: 8.0, lane: 3 }, { time: 8.5, lane: 1 }, { time: 9.0, lane: 2 },

    // [10 ~ 22초: Verse 1]
    { time: 10.0, lane: 0 }, { time: 10.4, lane: 1 }, { time: 10.8, lane: 2 }, { time: 11.2, lane: 3 },
    { time: 12.0, lane: 1 }, { time: 12.4, lane: 2 }, { time: 13.0, lane: 0 }, { time: 13.5, lane: 3 },
    { time: 14.0, lane: 1 }, { time: 14.4, lane: 0 }, { time: 14.8, lane: 2 }, { time: 15.2, lane: 3 },
    { time: 16.0, lane: 0 }, { time: 16.0, lane: 2 }, { time: 16.5, lane: 1 }, { time: 17.0, lane: 3 },
    { time: 18.0, lane: 0 }, { time: 18.5, lane: 1 }, { time: 19.0, lane: 2 }, { time: 19.5, lane: 3 },
    { time: 20.0, lane: 0 }, { time: 20.0, lane: 3 }, { time: 21.0, lane: 1 }, { time: 21.5, lane: 2 },

    // [22 ~ 35초: Chorus / 훅]
    { time: 22.0, lane: 0 }, { time: 22.4, lane: 1 }, { time: 22.8, lane: 2 }, { time: 23.2, lane: 3 },
    { time: 23.6, lane: 1 }, { time: 24.0, lane: 0 }, { time: 24.0, lane: 3 },
    { time: 24.5, lane: 2 }, { time: 24.8, lane: 1 }, { time: 25.2, lane: 0 }, { time: 25.6, lane: 3 },
    { time: 26.0, lane: 1 }, { time: 26.0, lane: 2 }, { time: 26.5, lane: 0 }, { time: 26.8, lane: 3 },
    { time: 27.2, lane: 1 }, { time: 27.6, lane: 2 }, { time: 28.0, lane: 0 }, { time: 28.3, lane: 1 },
    { time: 28.6, lane: 2 }, { time: 29.0, lane: 3 }, { time: 30.0, lane: 0 }, { time: 30.5, lane: 3 },
    { time: 31.0, lane: 1 }, { time: 31.5, lane: 2 }, { time: 32.0, lane: 0 }, { time: 32.0, lane: 3 },

    // [35 ~ 50초: Verse 2 / 랩 파트]
    { time: 35.0, lane: 0 }, { time: 35.3, lane: 1 }, { time: 35.6, lane: 2 }, { time: 36.0, lane: 3 },
    { time: 37.0, lane: 1 }, { time: 37.4, lane: 2 }, { time: 38.0, lane: 0 }, { time: 38.4, lane: 3 },
    { time: 39.5, lane: 0 }, { time: 39.8, lane: 2 }, { time: 40.2, lane: 1 }, { time: 40.5, lane: 3 },
    { time: 42.0, lane: 0 }, { time: 42.0, lane: 1 }, { time: 43.0, lane: 2 }, { time: 43.0, lane: 3 },
    { time: 44.5, lane: 0 }, { time: 45.0, lane: 1 }, { time: 45.5, lane: 2 }, { time: 46.0, lane: 3 },
    { time: 47.0, lane: 1 }, { time: 47.5, lane: 2 }, { time: 48.0, lane: 0 }, { time: 48.5, lane: 3 },

    // [50 ~ 65초: 브릿지 & 빌드업]
    { time: 50.0, lane: 0 }, { time: 50.5, lane: 1 }, { time: 51.0, lane: 2 }, { time: 51.5, lane: 3 },
    { time: 52.5, lane: 0 }, { time: 52.5, lane: 3 }, { time: 53.5, lane: 1 }, { time: 53.5, lane: 2 },
    { time: 55.0, lane: 0 }, { time: 55.3, lane: 1 }, { time: 55.6, lane: 2 }, { time: 56.0, lane: 3 },
    { time: 57.0, lane: 0 }, { time: 57.25, lane: 1 }, { time: 57.5, lane: 2 }, { time: 57.75, lane: 3 },
    { time: 58.0, lane: 0 }, { time: 58.25, lane: 1 }, { time: 58.5, lane: 2 }, { time: 58.75, lane: 3 },
    { time: 59.0, lane: 0 }, { time: 59.0, lane: 3 }, { time: 60.0, lane: 1 }, { time: 60.0, lane: 2 },

    // [65 ~ 82초: 하이라이트 메인 훅]
    { time: 65.0, lane: 0 }, { time: 65.4, lane: 1 }, { time: 65.8, lane: 2 }, { time: 66.2, lane: 3 },
    { time: 67.0, lane: 1 }, { time: 67.0, lane: 2 }, { time: 67.5, lane: 0 }, { time: 68.0, lane: 3 },
    { time: 69.0, lane: 0 }, { time: 69.3, lane: 1 }, { time: 69.6, lane: 2 }, { time: 70.0, lane: 3 },
    { time: 71.0, lane: 1 }, { time: 71.5, lane: 2 }, { time: 72.0, lane: 0 }, { time: 72.0, lane: 3 },
    { time: 73.5, lane: 0 }, { time: 73.8, lane: 1 }, { time: 74.2, lane: 2 }, { time: 74.5, lane: 3 },
    { time: 76.0, lane: 0 }, { time: 76.5, lane: 3 }, { time: 77.0, lane: 1 }, { time: 77.5, lane: 2 },
    { time: 79.0, lane: 0 }, { time: 79.3, lane: 1 }, { time: 79.6, lane: 2 }, { time: 80.0, lane: 3 },
    { time: 81.0, lane: 0 }, { time: 81.0, lane: 3 }, { time: 82.0, lane: 1 }, { time: 82.0, lane: 2 },

    // [82 ~ 92초: 아웃트로 & 피날레]
    { time: 84.0, lane: 0 }, { time: 84.5, lane: 1 }, { time: 85.0, lane: 2 }, { time: 85.5, lane: 3 },
    { time: 87.0, lane: 0 }, { time: 87.5, lane: 2 }, { time: 88.0, lane: 1 }, { time: 88.5, lane: 3 },
    { time: 90.0, lane: 0 }, { time: 90.0, lane: 3 },
    { time: 91.5, lane: 1 }, { time: 91.5, lane: 2 }
  ]
};

// ==========================================
// 3. 변수 및 시스템 설정
// ==========================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let containerWidth, containerHeight;
let laneWidth, judgmentLineY;
let speed = 600;

let audioCtx = null;
let bgmAudio = new Audio();
let isPlaying = false;
let gameStartTime = 0;
let countdown = 3;

let score = 0;
let combo = 0;
let maxCombo = 0;
let liveNotes = [];
let effects = [];

const loadedImages = { bg: null, notes: [] };

function loadAssets() {
  const bgImg = new Image();
  bgImg.src = ASSETS_CONFIG.bg;
  bgImg.onload = () => { loadedImages.bg = bgImg; };

  ASSETS_CONFIG.notes.forEach((path, idx) => {
    const img = new Image();
    img.src = path;
    img.onload = () => { loadedImages.notes[idx] = img; };
  });
}
loadAssets();

function resizeCanvas() {
  const container = document.getElementById('game-container');
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  containerWidth = canvas.width;
  containerHeight = canvas.height;
  laneWidth = containerWidth / 4;
  judgmentLineY = containerHeight * 0.82;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playBeep(freq = 440, type = 'sine', duration = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

// ==========================================
// 4. 게임 시작 및 실행 제어
// ==========================================
function startGame() {
  initAudio();

  bgmAudio.src = ASSETS_CONFIG.audio;
  bgmAudio.load();

  // 음원 재생 종료 시 자동 게임 종료 이벤트 등록
  bgmAudio.onended = () => {
    endGame();
  };

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  score = 0;
  combo = 0;
  maxCombo = 0;
  effects = [];
  updateHUD();

  liveNotes = DEMO_SONG.notes.map(n => ({
    ...n,
    hit: false,
    missed: false
  }));

  isPlaying = true;
  countdown = 3;

  const countInterval = setInterval(() => {
    countdown--;
    if (countdown > 0) {
      playBeep(600, 'sine', 0.1);
    } else if (countdown === 0) {
      playBeep(1200, 'triangle', 0.2);
      clearInterval(countInterval);
      
      bgmAudio.currentTime = 0;
      const playPromise = bgmAudio.play();
      if (playPromise !== undefined) {
        playPromise.catch(error => {
          console.warn("오디오 재생 실패 (터치 권한 또는 캐시 지연):", error);
        });
      }
      gameStartTime = performance.now();
    }
  }, 1000);

  requestAnimationFrame(gameLoop);
}

function updateHUD() {
  document.getElementById('score-display').innerText = String(score).padStart(6, '0');
  document.getElementById('combo-display').innerText = combo > 2 ? `${combo} COMBO` : '';
}

function handleInput(laneIndex) {
  if (!isPlaying || countdown > 0) return;

  const currentTime = (performance.now() - gameStartTime) / 1000;
  playBeep(300 + laneIndex * 100, 'square', 0.05);

  const target = liveNotes.find(n => n.lane === laneIndex && !n.hit && !n.missed);

  if (target) {
    const diff = Math.abs(target.time - currentTime);
    if (diff <= 0.12) {
      target.hit = true;
      combo++;
      if (combo > maxCombo) maxCombo = combo;
      const pts = diff <= 0.06 ? 1000 : 700;
      score += pts;
      addEffect(laneIndex, diff <= 0.06 ? 'PERFECT' : 'GREAT');
      updateHUD();
    }
  }
}

function addEffect(lane, text) {
  effects.push({
    x: lane * laneWidth + laneWidth / 2,
    y: judgmentLineY - 20,
    text: text,
    alpha: 1.0
  });
}

function gameLoop(timestamp) {
  if (!isPlaying) return;

  ctx.clearRect(0, 0, containerWidth, containerHeight);

  if (loadedImages.bg) {
    ctx.drawImage(loadedImages.bg, 0, 0, containerWidth, containerHeight);
  } else {
    ctx.fillStyle = '#11111d';
    ctx.fillRect(0, 0, containerWidth, containerHeight);
  }

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(i * laneWidth, 0);
    ctx.lineTo(i * laneWidth, containerHeight);
    ctx.stroke();
  }

  ctx.strokeStyle = '#00f0ff';
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(0, judgmentLineY);
  ctx.lineTo(containerWidth, judgmentLineY);
  ctx.stroke();

  if (countdown > 0) {
    ctx.fillStyle = '#00f0ff';
    ctx.font = 'bold 60px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(countdown, containerWidth / 2, containerHeight / 2);
    requestAnimationFrame(gameLoop);
    return;
  }

  const currentTime = (performance.now() - gameStartTime) / 1000;

  liveNotes.forEach(note => {
    if (note.hit) return;

    const timeDiff = note.time - currentTime;
    const noteY = judgmentLineY - (timeDiff * speed);
    const noteHeight = 25;

    if (timeDiff < -0.2 && !note.missed) {
      note.missed = true;
      combo = 0;
      addEffect(note.lane, 'MISS');
      updateHUD();
    }

    if (noteY > -50 && noteY < containerHeight + 50 && !note.missed) {
      const noteX = note.lane * laneWidth + 4;
      const noteW = laneWidth - 8;

      if (loadedImages.notes[note.lane]) {
        ctx.drawImage(loadedImages.notes[note.lane], noteX, noteY - noteHeight/2, noteW, noteHeight);
      } else {
        ctx.fillStyle = note.lane % 2 === 0 ? '#ff0055' : '#00ccff';
        ctx.beginPath();
        ctx.roundRect(noteX, noteY - noteHeight/2, noteW, noteHeight, 6);
        ctx.fill();
      }
    }
  });

  for (let i = effects.length - 1; i >= 0; i--) {
    const eff = effects[i];
    ctx.fillStyle = eff.text === 'MISS' ? `rgba(255, 0, 0, ${eff.alpha})` : `rgba(0, 240, 255, ${eff.alpha})`;
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(eff.text, eff.x, eff.y);

    eff.y -= 1;
    eff.alpha -= 0.03;
    if (eff.alpha <= 0) effects.splice(i, 1);
  }

  // 마지막 노트가 통과한 후 오디오 종료 대기 (최대 안전 종료 타임아웃)
  const lastNoteTime = DEMO_SONG.notes[DEMO_SONG.notes.length - 1].time;
  if (currentTime > lastNoteTime + 4.0) {
    endGame();
    return;
  }

  requestAnimationFrame(gameLoop);
}

function endGame() {
  isPlaying = false;
  try {
    bgmAudio.pause();
  } catch(e) {}
  document.getElementById('result-score').innerText = `SCORE: ${score}`;
  document.getElementById('result-combo').innerText = `MAX COMBO: ${maxCombo}`;
  document.getElementById('result-screen').classList.remove('hidden');
}

// ==========================================
// 5. 이벤트 바인딩
// ==========================================
const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3, '1': 0, '2': 1, '3': 2, '4': 3 };

window.addEventListener('keydown', (e) => {
  const lane = keyMap[e.key.toLowerCase()];
  if (lane !== undefined) {
    const pad = document.getElementById(`pad-${lane}`);
    if (pad) pad.classList.add('active');
    handleInput(lane);
  }
});

window.addEventListener('keyup', (e) => {
  const lane = keyMap[e.key.toLowerCase()];
  if (lane !== undefined) {
    const pad = document.getElementById(`pad-${lane}`);
    if (pad) pad.classList.remove('active');
  }
});

[0, 1, 2, 3].forEach(lane => {
  const pad = document.getElementById(`pad-${lane}`);
  pad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    pad.classList.add('active');
    handleInput(lane);
  });
  pad.addEventListener('touchend', (e) => {
    e.preventDefault();
    pad.classList.remove('active');
  });
});

const startBtn = document.getElementById('start-btn');
const fallbackBtn = document.getElementById('start-btn-fallback');

if (startBtn) startBtn.addEventListener('click', startGame);
if (fallbackBtn) fallbackBtn.addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
</script>
</body>
</html>
